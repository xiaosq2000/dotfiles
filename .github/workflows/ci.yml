name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck and zsh
        run: |
          set -eu
          if command -v shellcheck >/dev/null 2>&1 && command -v zsh >/dev/null 2>&1; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 update &&
               sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 install -y --no-install-recommends shellcheck zsh; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 5
          done
          exit 1
      - uses: pre-commit/action@v3.0.1
        env:
          # Gitleaks runs before publication through the local Git hooks.
          SKIP: gitleaks
      - name: Run offline unit and security test suite
        run: python3 -m unittest tests.test_suite.UnitChecks -v

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Clippy and unit tests
        run: |
          cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path cli/Cargo.toml
      - name: Verify generated zsh completion syntax
        run: |
          set -eu
          if ! command -v zsh >/dev/null 2>&1; then
            ok=0
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 update &&
                 sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 install -y --no-install-recommends zsh; then
                ok=1
                break
              fi
              [ "$attempt" -lt 3 ] && sleep 5
            done
            [ "$ok" -eq 1 ]
          fi
          cargo run --quiet --manifest-path cli/Cargo.toml -- completion zsh > /tmp/_dotfiles
          zsh -n /tmp/_dotfiles
      - name: Run Rust CLI integration tests
        run: |
          set -eu
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
          DOTFILES_CLI_BIN=cli/target/debug/dotfiles python3 tests/check_dotfiles_cli.py

  smoke:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install prerequisites
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            if apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 update &&
               apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 install -y --no-install-recommends curl git ca-certificates python3 zsh shellcheck; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ] && [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sleep 5
          done
          exit 1
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Run chezmoi render and behavioral test suite
        env:
          SKIP_RUST_CLI: "1"
        run: python3 -m unittest tests.test_suite.ChezmoiChecks -v
      - name: Apply in a clean home without a key or software bundles
        run: |
          set -eu
          mkdir -p "$HOME/.local/share"
          cp -a "$PWD" "$HOME/.local/share/chezmoi"
          # Theme downloads are not part of the installation smoke test.
          chezmoi init --apply --no-tty --exclude externals \
            --promptString machine=container \
            --promptString theme=rose-pine
          chezmoi verify --exclude externals
          bash -n "$HOME/.bashrc"
          zsh -n "$HOME/.zshrc"
