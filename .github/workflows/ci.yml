name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The shellcheck hook uses language: system so that it runs the binary
      # from the pixi manifest locally instead of pulling a Docker image, so
      # CI has to provide shellcheck itself.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # Running the hooks rather than a separate lint command keeps CI and a
      # local `pre-commit run --all-files` checking exactly the same files.
      - uses: pre-commit/action@v3.0.1

  setup-scripts:
    name: lifecycle scripts render and parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash .github/scripts/check-setup-scripts.sh

  software-lifecycle:
    name: software installation and removal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi and launcher validator
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python3 .github/scripts/check-software.py

  software-upstreams:
    name: real software and font downloads
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install download check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig desktop-file-utils libgl1 libxkbcommon0 libxkbcommon-x11-0
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python3 .github/scripts/check-software.py --live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tool-bundles:
    name: bundle data is self-consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-tool-bundles.sh

  theme-data:
    name: every theme variant is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-theme-palettes.sh

  # The pre-commit job already runs the check over the commit. This job proves
  # the check still fails on the two mistakes it exists for; otherwise a typo in
  # its directory list would pass every commit and look green forever.
  encrypted-paths:
    name: plaintext is refused where secrets live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-encrypted.sh
      - name: It rejects plaintext, by name and by content
        run: |
          set -eux
          dir=dot_agents/skills/private_machines/references
          mkdir -p "$dir"
          check() { bash .github/scripts/check-encrypted.sh; }

          # What `chezmoi add` without --encrypt produces.
          echo 'Host example' > "$dir/private_leak.md"
          git add "$dir/private_leak.md"
          if check; then echo "plaintext under a private_ name passed" >&2; exit 1; fi
          git rm -q --cached "$dir/private_leak.md"

          # The right name around the wrong content.
          echo 'Host example' > "$dir/encrypted_private_leak.md.age"
          git add "$dir/encrypted_private_leak.md.age"
          if check; then echo "plaintext under an encrypted_ name passed" >&2; exit 1; fi
          git rm -q --cached "$dir/encrypted_private_leak.md.age"

          # And the tree is clean again.
          check

  # The pre-commit job runs the key hooks over a tree that holds no key, so it
  # would pass even if they could no longer catch one. This job feeds them keys.
  private-keys:
    name: private keys are refused before a commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - name: It refuses a key by name and by content
        run: |
          set -eux
          # Built at run time, so this file holds no key for the hooks to find.
          ssh_key=$(printf -- '-----BEGIN %s PRIVATE KEY-----' OPENSSH)
          age_key=AGE-SECRET-KEY-1$(printf 'Q%.0s' $(seq 58))

          # .gitignore takes what `chezmoi add` would write for a key...
          git check-ignore -q --no-index private_dot_ssh/private_id_ed25519
          git check-ignore -q --no-index private_dot_config/chezmoi/private_key.txt
          # ...but not ciphertext, and not a public half.
          ! git check-ignore -q --no-index private_dot_ssh/encrypted_private_id_ed25519.age || exit 1
          ! git check-ignore -q --no-index private_dot_ssh/id_ed25519.pub || exit 1

          # The content hooks, on a name no .gitignore pattern covers.
          printf '%s\nb3BlbnNzaC1rZXktdjEA\n' "$ssh_key" > leak.txt
          if pre-commit run detect-private-key --files leak.txt; then echo "an ssh private key passed" >&2; exit 1; fi
          printf '%s\n' "$age_key" > leak.txt
          if pre-commit run no-age-identity --files leak.txt; then echo "an age identity passed" >&2; exit 1; fi
          # A placeholder in a document is not a key.
          printf 'AGE-SECRET-KEY-1...\n' > leak.txt
          pre-commit run no-age-identity --files leak.txt
          # A plaintext home path is an account name. Built at run time, so
          # this file holds none.
          printf 'login_shell /%s/%s/.pixi/bin/zsh\n' home somebody > leak.txt
          if pre-commit run no-home-paths --files leak.txt; then echo "a home path passed" >&2; exit 1; fi
          printf 'login_shell $HOME/.pixi/bin/zsh\n' > leak.txt
          pre-commit run no-home-paths --files leak.txt
          rm leak.txt

  bootstrap:
    name: bootstrap in a clean container
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      # python3 is for the key guard: its hook, and the modify_ scripts that
      # merge it into the Claude Code and Codex configs. The image has none, and
      # every real machine does.
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y curl git unzip ca-certificates zsh python3

      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      # Put the checkout where chezmoi looks by default, so the rest of this
      # job runs exactly the code path a real machine runs. Passing --source
      # instead would diverge: `theme` shells out to a bare `chezmoi apply`,
      # which resolves the default source directory, and chezmoi has no
      # environment variable for overriding it.
      #
      # Either way the commit under test is what gets applied. The old
      # install.sh could not be tested at all, because it always cloned
      # origin/main and so exercised the published branch rather than the
      # change being proposed.
      - name: Stage the checkout as the chezmoi source
        run: |
          mkdir -p "$HOME/.local/share"
          cp -a "$PWD" "$HOME/.local/share/chezmoi"

      # The container machine selects no bundles, because the tool chain pulls
      # rust, node and a conda environment over the network, which belongs in a
      # slower job than one that should gate every push. The names in the setup
      # list are verified by the setup-scripts job instead.
      - name: chezmoi init --apply
        run: |
          chezmoi init --apply --verbose \
            --promptString machine=container \
            --promptString theme=rose-pine

      - name: Destination matches the source state
        run: chezmoi verify

      - name: Files landed where they should
        run: |
          set -eux
          test -f "$HOME/.zshrc"
          test -f "$HOME/.bashrc"
          test ! -e "$HOME/.sh_utils/setup.d/pixi.sh"
          test -x "$HOME/.local/libexec/dotfiles/agent-skills.sh"
          test -x "$HOME/.local/libexec/dotfiles/agent-plugins.sh"
          test ! -e "$HOME/.config/kitty"
          test ! -e "$HOME/.config/alacritty"
          test ! -e "$HOME/.config/zathura"
          test ! -e "$HOME/.config/fcitx5"
          test ! -e "$HOME/.local/kitty.app"
          test ! -e "$HOME/.local/zotero"
          test -x "$HOME/.local/bin/theme"
          test -x "$HOME/.local/bin/machine"
          # The headless profile keeps tpm and the btop theme. These checkouts must
          # stay dropped: the starship fork, replaced on 2026-09-19 by a prompt
          # rendered from the palette in .chezmoidata, and the gnome-terminal
          # theme, removed entirely because gnome-terminal is no longer used.
          test -f "$HOME/.local/share/tmux/plugins/tpm/tpm"
          test -f "$HOME/.config/starship.toml"
          test ! -e "$HOME/.config/themes/rose-pine/starship"
          test ! -e "$HOME/.config/themes/rose-pine/gnome-terminal"
          # repo infrastructure must not be deployed as dotfiles. A ~/CLAUDE.md
          # would also load into every Claude Code session started in ~.
          test ! -e "$HOME/README.md"
          test ! -e "$HOME/docs"
          test ! -e "$HOME/.github"
          test ! -e "$HOME/AGENTS.md"
          test ! -e "$HOME/CLAUDE.md"
          test ! -e "$HOME/.gitattributes"

      # GUI rendering, including account-free Kitty SSH settings, is covered
      # by software-lifecycle. This container deliberately has no desktop.

      # The manifest is rendered from the bundles a machine selects, so the
      # thing worth testing is that the selection reaches the file. The
      # container machine selects nothing, which has to produce a manifest with
      # no environments rather than an error or an empty file.
      - name: Bundles render into the pixi manifest
        run: |
          set -eux
          test -f "$HOME/.pixi/manifests/pixi-global.toml"
          grep -q '^version = 1$' "$HOME/.pixi/manifests/pixi-global.toml"
          test "$(grep -c '^\[envs\.' "$HOME/.pixi/manifests/pixi-global.toml")" -eq 0
          # A machine that does select bundles renders those packages and
          # exposes them, and never exposes a runtime that came along for the
          # ride.
          chezmoi execute-template \
            '{{ range $p := (index .bundles "core").packages }}{{ $p }} {{ end }}' |
            tee /tmp/core-packages
          grep -q nvim /tmp/core-packages
          grep -q chezmoi /tmp/core-packages

      # The container machine selects no bundles, so sheldon is not installed
      # and its plugins are not cloned. What can be checked is that the config
      # landed and that nothing still reaches for oh-my-zsh, which would make
      # every shell on a fresh machine print an error.
      - name: The shell no longer depends on oh-my-zsh
        run: |
          set -eux
          test -f "$HOME/.config/sheldon/plugins.toml"
          grep -q 'zsh-vi-mode' "$HOME/.config/sheldon/plugins.toml"
          # `|| exit 1` on every negated check: set -e ignores a command negated
          # with `!`, so a bare `! grep` passes whether or not it matches. The
          # negated-assertions hook in .pre-commit-config.yaml enforces this.
          ! grep -q 'oh-my-zsh.sh' "$HOME/.zshrc" || exit 1
          ! grep -q 'ZSH_CUSTOM' "$HOME/.zshrc" || exit 1
          test ! -e "$HOME/.sh_utils/setup.d/zsh.sh"
          # The replacements for what the framework used to provide.
          grep -q 'autoload -Uz compinit' "$HOME/.zshrc"
          grep -q "alias -- ..='cd ..'" "$HOME/.zshrc"
          grep -q 'web_search()' "$HOME/.zshrc"
          # A real zsh parses it.
          zsh -n "$HOME/.zshrc"

      # A pipe skips UI styles, so it cannot catch regressions in the terminal
      # startup path. Check the deployed library through a PTY in both shells.
      - name: UI styles respect the terminal without spawning tput
        run: python3 "$HOME/.local/share/chezmoi/.github/scripts/check-ui.py" "$HOME/.sh_utils/lib/ui.sh"

      # Completions are cached to files on fpath rather than evaluated at every
      # shell start, which was 516 ms of a 750 ms startup before 2026-09-20. See
      # dot_sh_utils/CAVEATS.md.
      #
      # The container machine selects no bundles, so pixi, codex and uv are all
      # absent here. That is the case worth testing: the block has to put the
      # directory on fpath, generate nothing, and say nothing. A machine that
      # does have the tools cannot be tested in a job meant to gate every push,
      # because installing them pulls a conda environment over the network.
      - name: Tool completions are cached on fpath, not evaluated
        run: |
          set -eux
          # The eval form is what this replaced; it must not come back.
          ! grep -q 'eval "$(pixi completion' "$HOME/.zshrc" || exit 1
          ! grep -q 'eval "$(codex completion' "$HOME/.zshrc" || exit 1
          ! grep -q 'source "$_uv_completion_cache"' "$HOME/.zshrc" || exit 1
          # fpath has to be set before compinit, or compinit will not see it.
          fpath_line=$(grep -n '^fpath=(' "$HOME/.zshrc" | head -1 | cut -d: -f1)
          compinit_line=$(grep -n '^autoload -Uz compinit' "$HOME/.zshrc" | cut -d: -f1)
          gen_line=$(grep -n '^_zcompcache=' "$HOME/.zshrc" | cut -d: -f1)
          pnpm_line=$(grep -n '^export PNPM_HOME=' "$HOME/.zshrc" | cut -d: -f1)
          test "$fpath_line" -lt "$compinit_line"
          # Every tool must be on PATH before the block that generates its
          # completion. codex is a pnpm binary, and pnpm's PATH entry used to sit
          # below compinit, so a shell that did not already have it inherited
          # generated no codex completion and never noticed. Caught only on a
          # login shell with a clean environment.
          test "$pnpm_line" -lt "$gen_line"
          # The directory joins fpath even with none of the three tools present.
          timeout 60 zsh -ic 'print -l $fpath' | grep -q '/zsh/completions$'
          # Startup raises nothing zsh itself would call an error. Not a silence
          # check: .zshrc prints its own timing line, and on a machine with no
          # bundles it also says that yazi and sheldon are missing, which is
          # true and is the point of saying it. The target is the failure the
          # old arrangement produced, `command not found: compdef`, which was a
          # warning on every new shell rather than anything that stopped it.
          # Hence zsh's own wording rather than a bare "not found".
          ! timeout 60 zsh -ic 'true' 2>&1 | grep -qE 'command not found|parse error|bad pattern' || exit 1

      # Inside kitty, `ssh` is a function that runs `kitten ssh`, and the kitten
      # refuses to run without a terminal, which broke ssh in every AI agent's
      # shell. It now falls back to plain ssh unless stdin and stdout are both a
      # terminal. Stubs stand in for both programs, since the container has
      # neither, and `script` supplies the terminal.
      - name: ssh uses the kitten only at a terminal
        run: |
          set -eux
          mkdir -p /tmp/stub
          printf '#!/bin/sh\necho kitten "$@"\n' > /tmp/stub/kitten
          printf '#!/bin/sh\necho plain "$@"\n' > /tmp/stub/ssh
          chmod +x /tmp/stub/kitten /tmp/stub/ssh
          export PATH="/tmp/stub:$PATH" TERM=xterm-kitty KITTY_WINDOW_ID=1 KITTY_PID=1
          at_tty() { timeout 60 script -qec "zsh -ic '$1'" /dev/null 2>/dev/null | tr -d '\r' | tail -1; }
          test "$(timeout 60 zsh -ic 'ssh somehost' < /dev/null 2>/dev/null | tail -1)" = "plain somehost"
          test "$(at_tty 'ssh somehost | cat')" = "plain somehost"
          test "$(at_tty 'ssh somehost')" = "kitten ssh somehost"

      # Everything oh-my-zsh used to set as a side effect of being sourced.
      # Dropping the framework dropped these with it, and the failures do not
      # look like a shell misconfiguration: without interactive_comments,
      # pasting a documented command that ends in `# explanation` passes every
      # word of the explanation as an argument, and the error names the program.
      #
      # Checked twice over. The greps catch a line being deleted from the
      # source; the live check catches it being set somewhere that does not take
      # effect, which greps cannot see.
      - name: The shell options oh-my-zsh used to provide
        run: |
          set -eu
          for opt in interactive_comments multios long_list_jobs pushdminus \
                     prompt_subst auto_menu complete_in_word always_to_end \
                     auto_cd auto_pushd pushd_ignore_dups extended_history \
                     share_history hist_verify hist_ignore_space; do
            grep -qE "^setopt ${opt}( |$)" "$HOME/.zshrc" || {
              echo "setopt $opt is missing from .zshrc" >&2; exit 1; }
          done
          for opt in menu_complete flowcontrol beep; do
            grep -qE "^unsetopt ${opt}( |$)" "$HOME/.zshrc" || {
              echo "unsetopt $opt is missing from .zshrc" >&2; exit 1; }
          done
          grep -q "^WORDCHARS=''" "$HOME/.zshrc"

          # And assert them in a shell that has actually read the file. The
          # timeout is because a hung interactive shell would otherwise run to
          # the job limit.
          timeout 120 zsh -ic '
            for o in interactive_comments multios long_list_jobs pushdminus \
                     prompt_subst auto_menu complete_in_word always_to_end; do
              [[ -o $o ]] || { print -u2 "option $o is off"; exit 1 }
            done
            for o in menu_complete flowcontrol; do
              [[ -o $o ]] && { print -u2 "option $o is on"; exit 1 }
            done
            [[ -z $WORDCHARS ]] || { print -u2 "WORDCHARS is not empty"; exit 1 }
            print "shell options ok"
          '

          # The paste that found this: a trailing comment must be a comment.
          test "$(timeout 60 zsh -ic 'echo ok # trailing comment' 2>/dev/null | tail -1)" = ok

      - name: Theme renders and switches
        run: |
          set -eux
          nvim_theme="$HOME/.config/nvim/lua/plugins/ui/colorscheme.lua"

          # Rosé Pine, the scheme with a full set of ports.
          grep -q 'rose-pine-main' "$nvim_theme"
          grep -q 'rose-pine/neovim' "$nvim_theme"
          # starship.toml was a symlink into the fork until 2026-09-19. It is a
          # rendered file now, so the variant shows in the palette it selects.
          test ! -L "$HOME/.config/starship.toml"
          grep -q '^palette = "rose-pine"$' "$HOME/.config/starship.toml"

          # The fetched theme files go to a fixed name, so the configs that
          # read them never mention a variant.
          grep -q '^color_theme = "current"$' "$HOME/.config/btop/btop.conf"
          test -s "$HOME/.config/btop/themes/current.theme"

          # A variant switch within the scheme.
          "$HOME/.local/bin/theme" rose-pine-dawn
          grep -q 'rose-pine-dawn' "$nvim_theme"
          grep -q '^palette = "rose-pine-dawn"$' "$HOME/.config/starship.toml"
          chezmoi verify

      # Catppuccin is the second scheme, and the one that proves a scheme is
      # data rather than a special case. It had no starship port while the
      # prompt came from a checkout; now that the prompt renders from theme
      # data it has one like any other, so starship.toml stays managed across
      # the switch and only the palette it selects changes.
      - name: A second colour scheme needs no new template
        run: |
          set -eux
          nvim_theme="$HOME/.config/nvim/lua/plugins/ui/colorscheme.lua"

          "$HOME/.local/bin/theme" catppuccin-mocha
          grep -q 'catppuccin-mocha' "$nvim_theme"
          grep -q 'catppuccin/nvim' "$nvim_theme"
          grep -q '1e1e2e' "$HOME/.config/btop/themes/current.theme"
          test "$(chezmoi managed | grep -c '^\.config/starship\.toml$')" -eq 1
          grep -q '^palette = "catppuccin-mocha"$' "$HOME/.config/starship.toml"
          chezmoi verify

          # And back.
          "$HOME/.local/bin/theme" rose-pine
          test "$(chezmoi managed | grep -c '^\.config/starship\.toml$')" -eq 1
          grep -q '^palette = "rose-pine"$' "$HOME/.config/starship.toml"
          chezmoi verify

      # Driven by a stored config rather than by --promptString, because
      # promptStringOnce returns the value already in the config and ignores
      # the flag entirely once one is recorded. Asserting it with a flag passes
      # for the wrong reason.
      - name: An unknown theme fails at init, and says what the valid ones are
        run: |
          set -eux
          src="$HOME/.local/share/chezmoi"
          cfg="$HOME/.config/chezmoi/chezmoi.toml"

          sed 's/theme = "[^"]*"/theme = "not-a-theme"/' "$cfg" > /tmp/cfg-bad.toml
          if chezmoi --config /tmp/cfg-bad.toml --config-format toml \
              execute-template --init < "$src/.chezmoi.toml.tmpl" 2>/tmp/err; then
            echo "expected an unknown theme to fail" >&2
            exit 1
          fi
          grep -q 'unknown theme' /tmp/err
          grep -q 'catppuccin-mocha' /tmp/err

      # `ageRecipient` in .chezmoidata/secrets.toml is the switch, and it has
      # been filled in since 2026-09-19, so neither state can be read off the
      # repository's own default any more: this renders both.
      #
      # The ordering assertion is the important one. A bare key after a table
      # header belongs to that table in TOML, so `encryption` below [data]
      # silently becomes data.encryption and chezmoi carries on unencrypted
      # with only a warning.
      - name: Encryption is off when unkeyed, and top-level when on
        run: |
          set -eux
          src="$HOME/.local/share/chezmoi"
          data="$src/.chezmoidata/secrets.toml"
          cp "$data" /tmp/secrets.toml.orig

          render() {
            chezmoi execute-template --init \
              --promptString machine=container \
              --promptString theme=rose-pine \
              < "$src/.chezmoi.toml.tmpl"
          }

          # No recipient: a machine without the key must still apply the rest.
          sed -i 's/^ageRecipient = .*/ageRecipient = ""/' "$data"
          render > /tmp/cfg-off.toml
          grep -qi 'no encryption' /tmp/cfg-off.toml
          ! grep -q '^encryption' /tmp/cfg-off.toml || exit 1
          ! grep -q '^\[age\]' /tmp/cfg-off.toml || exit 1

          # Recipient present: the whole mechanism switches on.
          sed -i 's/^ageRecipient = .*/ageRecipient = "age1ci0000000000000000000000000000000000000000000000000000"/' "$data"
          render > /tmp/cfg-on.toml
          grep -q '^encryption = "age"$' /tmp/cfg-on.toml
          grep -q '^\[age\]$' /tmp/cfg-on.toml
          grep -q 'age1ci0000' /tmp/cfg-on.toml

          enc=$(grep -n '^encryption = "age"$' /tmp/cfg-on.toml | cut -d: -f1)
          dat=$(grep -n '^\[data\]$' /tmp/cfg-on.toml | cut -d: -f1)
          test "$enc" -lt "$dat"

          # Restored with a copy rather than `git checkout`: the source is a
          # `cp -a` of the checkout, so its ownership does not match the
          # container user and git refuses to work in it at all. Later steps
          # need the real recipient back, so this cannot just be skipped.
          cp /tmp/secrets.toml.orig "$data"

      # Same TOML hazard as the encryption block, in a second file. sicc is the
      # only machine that sets both a relocated channel index and detached
      # environments, so it is the only render where the order can go wrong: a
      # bare key below [cache] becomes cache.detached-environments and pixi
      # keeps putting environments beside every workspace while looking
      # configured.
      - name: The pixi config keeps bare keys above its tables
        run: |
          set -eux
          src="$HOME/.local/share/chezmoi"
          sed 's/machine = "container"/machine = "sicc"/' \
            "$HOME/.config/chezmoi/chezmoi.toml" > /tmp/cfg-sicc.toml
          chezmoi --config /tmp/cfg-sicc.toml --config-format toml \
            execute-template < "$src/private_dot_config/pixi/config.toml.tmpl" \
            > /tmp/pixi-sicc.toml

          grep -q '^detached-environments = ' /tmp/pixi-sicc.toml
          grep -q '^\[cache\]$' /tmp/pixi-sicc.toml
          det=$(grep -n '^detached-environments = ' /tmp/pixi-sicc.toml | cut -d: -f1)
          cache=$(grep -n '^\[cache\]$' /tmp/pixi-sicc.toml | cut -d: -f1)
          test "$det" -lt "$cache"

          # And a machine with no overrides gets a file with no settings at all,
          # rather than an empty or malformed one.
          chezmoi execute-template \
            < "$src/private_dot_config/pixi/config.toml.tmpl" > /tmp/pixi-container.toml
          ! grep -qE '^[a-z[]' /tmp/pixi-container.toml || exit 1

      # The key guard. Claude Code and Codex write their config files
      # themselves, so chezmoi merges the guard in with modify_ scripts instead
      # of owning the files. The merge has to keep what the agent wrote, change
      # nothing on a second run, and never fail an apply.
      - name: Agents are kept away from private keys
        run: |
          set -eux
          src="$HOME/.local/share/chezmoi"
          guard="$HOME/.agents/hooks/key-guard.py"

          # The deployed guard, run by its shebang the way the agents run it,
          # then against every case the source copy is held to.
          test -x "$guard"
          rc=0
          echo '{"tool_name":"Bash","tool_input":{"command":"cat ~/.ssh/id_rsa"}}' | "$guard" || rc=$?
          test "$rc" -eq 2
          bash "$src/.github/scripts/check-key-guard.sh" "$guard"

          # Each agent is wired to it.
          test -f "$HOME/.config/opencode/plugins/key-guard.js"
          test "$(stat -c %a "$HOME/.codex/config.toml")" = 600
          python3 - <<'EOF'
          import json, os, tomllib
          home = os.environ["HOME"]
          claude = json.load(open(home + "/.claude/settings.json"))
          assert "Read(~/.ssh/id_ed25519)" in claude["permissions"]["deny"], claude
          assert "Read(~/.config/chezmoi/key.txt)" in claude["permissions"]["deny"], claude
          hooks = [h["command"] for g in claude["hooks"]["PreToolUse"] for h in g["hooks"]]
          assert hooks == ["~/.agents/hooks/key-guard.py"], hooks
          codex_hooks = json.load(open(home + "/.codex/hooks.json"))
          assert codex_hooks["hooks"]["PreToolUse"][0]["hooks"][0]["command"] == "~/.agents/hooks/key-guard.py"
          codex = tomllib.load(open(home + "/.codex/config.toml", "rb"))
          assert codex["default_permissions"] == "key-guard", codex
          # Globs under ~/.ssh: Codex creates an empty file at an exact path
          # that does not exist, and can leave it behind. The ssh drop-in
          # directory is hidden so that ssh runs in the sandbox.
          deny = {p: "deny" for p in ["~/.ssh/id_*[!b]", "~/.ssh/id_*[!u]b", "~/.ssh/id_*[!p]ub", "~/.ssh/id_*[!.]pub"]}
          assert codex["permissions"]["key-guard"]["filesystem"] == {**deny, "/etc/ssh/ssh_config.d": "deny"}, codex
          assert codex["permissions"]["key-guard"]["network"]["enabled"] is True, codex
          # The globs select every id_* name except a .pub file, as Python's
          # fnmatch reads them. That Codex reads them the same way was checked
          # by hand, since the container has no Codex.
          from fnmatch import fnmatchcase
          def denied(name):
              return any(fnmatchcase("~/.ssh/" + name, p) for p in deny)
          for name in ["id_rsa", "id_ed25519", "id_ed25519_sk", "id_work", "id_club"]:
              assert denied(name), name
          for name in ["id_ed25519.pub", "id_work.pub", "config", "known_hosts"]:
              assert not denied(name), name
          EOF

          # What the agents wrote survives an apply, and the guard joins it.
          printf '{"theme": "dark", "permissions": {"allow": ["Bash(ls)"]}}\n' > "$HOME/.claude/settings.json"
          printf 'model = "o3"\n\n[projects."/tmp"]\ntrust_level = "trusted"\n' > "$HOME/.codex/config.toml"
          chezmoi apply --force "$HOME/.claude/settings.json" "$HOME/.codex/config.toml"
          python3 - <<'EOF'
          import json, os, tomllib
          home = os.environ["HOME"]
          claude = json.load(open(home + "/.claude/settings.json"))
          assert claude["theme"] == "dark" and claude["permissions"]["allow"] == ["Bash(ls)"], claude
          assert len(claude["permissions"]["deny"]) == 8, claude
          codex = tomllib.load(open(home + "/.codex/config.toml", "rb"))
          assert codex["model"] == "o3" and codex["projects"]["/tmp"]["trust_level"] == "trusted", codex
          assert codex["default_permissions"] == "key-guard", codex
          assert codex["permissions"]["key-guard"]["network"]["enabled"] is True, codex
          EOF
          # A second pass finds nothing left to change.
          chezmoi verify

          # Without python3 the files pass through untouched, and the apply goes on.
          mkdir -p /tmp/nopy
          ln -sf /bin/cat /tmp/nopy/cat
          PATH=/tmp/nopy /bin/sh "$src/dot_claude/modify_settings.json" < "$HOME/.claude/settings.json" > /tmp/nopy-settings.json
          cmp "$HOME/.claude/settings.json" /tmp/nopy-settings.json
          PATH=/tmp/nopy /bin/sh "$src/dot_codex/modify_private_config.toml" < "$HOME/.codex/config.toml" > /tmp/nopy-config.toml
          cmp "$HOME/.codex/config.toml" /tmp/nopy-config.toml

      # A machine with no age identity has to apply everything that is not
      # encrypted, and it is not enough to check that the apply exits zero.
      #
      # chezmoi aborts on a decryption failure rather than skipping the entry,
      # so every target sorting after the failed one is left untouched, and
      # .ssh/config sorts before .zshrc. The first version of this stopped at
      # ~/.ssh and silently left the shell config stale. .chezmoiignore now
      # drops the encrypted entries when the identity is absent, and the test
      # for that is a target that sorts after the encrypted one.
      - name: A machine with no key applies everything else, in full
        run: |
          set -eux
          rm -f "$HOME/.config/chezmoi/key.txt"

          chezmoi init --apply --promptString machine=container --promptString theme=rose-pine
          chezmoi verify

          # Sorts after .ssh/config, so it is the one that would go missing.
          test -f "$HOME/.zshrc"
          test -f "$HOME/.bashrc"
          test -f "$HOME/.config/sheldon/plugins.toml"
          test -x "$HOME/.local/bin/theme"

          # The encrypted entry is absent rather than half-written, and no
          # plaintext stand-in was left in its place.
          test ! -e "$HOME/.ssh/config"
          test ! -f "$HOME/.config/chezmoi/key.txt"

          # The machines skill is left out whole, not just its encrypted pages,
          # since a SKILL.md pointing at pages that are not there would send an
          # agent looking for them. The other skills sort after it, so their
          # arrival shows the apply did not stop at it.
          test ! -e "$HOME/.agents/skills/machines"
          test -f "$HOME/.agents/skills/plain-writing/SKILL.md"
          test -f "$HOME/.agents/skills/translate-zh/SKILL.md"
