name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The shellcheck hook uses language: system so that it runs the binary
      # from the pixi manifest locally instead of pulling a Docker image, so
      # CI has to provide shellcheck itself.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # Running the hooks rather than a separate lint command keeps CI and a
      # local `pre-commit run --all-files` checking exactly the same files.
      - uses: pre-commit/action@v3.0.1

  setup-scripts:
    name: run script references real setup scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-setup-scripts.sh

  tool-bundles:
    name: bundle data is self-consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-tool-bundles.sh

  theme-data:
    name: every theme variant is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-theme-palettes.sh

  bootstrap:
    name: bootstrap in a clean container
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y curl git unzip ca-certificates zsh

      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      # Put the checkout where chezmoi looks by default, so the rest of this
      # job runs exactly the code path a real machine runs. Passing --source
      # instead would diverge: `theme` shells out to a bare `chezmoi apply`,
      # which resolves the default source directory, and chezmoi has no
      # environment variable for overriding it.
      #
      # Either way the commit under test is what gets applied. The old
      # install.sh could not be tested at all, because it always cloned
      # origin/main and so exercised the published branch rather than the
      # change being proposed.
      - name: Stage the checkout as the chezmoi source
        run: |
          mkdir -p "$HOME/.local/share"
          cp -a "$PWD" "$HOME/.local/share/chezmoi"

      # The container machine selects no bundles, because the tool chain pulls
      # rust, node and a conda environment over the network, which belongs in a
      # slower job than one that should gate every push. The names in the setup
      # list are verified by the setup-scripts job instead.
      - name: chezmoi init --apply
        run: |
          chezmoi init --apply --verbose \
            --promptString machine=container \
            --promptString theme=rose-pine

      - name: Destination matches the source state
        run: chezmoi verify

      - name: Files landed where they should
        run: |
          set -eux
          test -f "$HOME/.zshrc"
          test -f "$HOME/.bashrc"
          test -f "$HOME/.sh_utils/setup.d/pixi.sh"
          test -x "$HOME/.sh_utils/setup.d/pixi.sh"
          test -x "$HOME/.local/bin/theme"
          test -x "$HOME/.local/bin/machine"
          # tpm is the only external left. Two checkouts were dropped and must
          # stay dropped: the starship fork, replaced on 2026-09-19 by a prompt
          # rendered from the palette in .chezmoidata, and the gnome-terminal
          # theme, removed entirely because gnome-terminal is no longer used.
          test -f "$HOME/.local/share/tmux/plugins/tpm/tpm"
          test -f "$HOME/.config/starship.toml"
          test ! -e "$HOME/.config/themes/rose-pine/starship"
          test ! -e "$HOME/.config/themes/rose-pine/gnome-terminal"
          # repo infrastructure must not be deployed as dotfiles
          test ! -e "$HOME/README.md"
          test ! -e "$HOME/docs"
          test ! -e "$HOME/.github"

      # The manifest is rendered from the bundles a machine selects, so the
      # thing worth testing is that the selection reaches the file. The
      # container machine selects nothing, which has to produce a manifest with
      # no environments rather than an error or an empty file.
      - name: Bundles render into the pixi manifest
        run: |
          set -eux
          test -f "$HOME/.pixi/manifests/pixi-global.toml"
          grep -q '^version = 1$' "$HOME/.pixi/manifests/pixi-global.toml"
          test "$(grep -c '^\[envs\.' "$HOME/.pixi/manifests/pixi-global.toml")" -eq 0
          # A machine that does select bundles renders those packages and
          # exposes them, and never exposes a runtime that came along for the
          # ride.
          chezmoi execute-template \
            '{{ range $p := (index .bundles "core").packages }}{{ $p }} {{ end }}' |
            tee /tmp/core-packages
          grep -q nvim /tmp/core-packages
          grep -q chezmoi /tmp/core-packages

      # The container machine selects no bundles, so sheldon is not installed
      # and its plugins are not cloned. What can be checked is that the config
      # landed and that nothing still reaches for oh-my-zsh, which would make
      # every shell on a fresh machine print an error.
      - name: The shell no longer depends on oh-my-zsh
        run: |
          set -eux
          test -f "$HOME/.config/sheldon/plugins.toml"
          grep -q 'zsh-vi-mode' "$HOME/.config/sheldon/plugins.toml"
          ! grep -q 'oh-my-zsh.sh' "$HOME/.zshrc"
          ! grep -q 'ZSH_CUSTOM' "$HOME/.zshrc"
          test ! -e "$HOME/.sh_utils/setup.d/zsh.sh"
          # The replacements for what the framework used to provide.
          grep -q 'autoload -Uz compinit' "$HOME/.zshrc"
          grep -q "alias -- ..='cd ..'" "$HOME/.zshrc"
          grep -q 'web_search()' "$HOME/.zshrc"
          # A real zsh parses it.
          zsh -n "$HOME/.zshrc"

      # Everything oh-my-zsh used to set as a side effect of being sourced.
      # Dropping the framework dropped these with it, and the failures do not
      # look like a shell misconfiguration: without interactive_comments,
      # pasting a documented command that ends in `# explanation` passes every
      # word of the explanation as an argument, and the error names the program.
      #
      # Checked twice over. The greps catch a line being deleted from the
      # source; the live check catches it being set somewhere that does not take
      # effect, which greps cannot see.
      - name: The shell options oh-my-zsh used to provide
        run: |
          set -eu
          for opt in interactive_comments multios long_list_jobs pushdminus \
                     prompt_subst auto_menu complete_in_word always_to_end \
                     auto_cd auto_pushd pushd_ignore_dups extended_history \
                     share_history hist_verify hist_ignore_space; do
            grep -qE "^setopt ${opt}( |$)" "$HOME/.zshrc" || {
              echo "setopt $opt is missing from .zshrc" >&2; exit 1; }
          done
          for opt in menu_complete flowcontrol beep; do
            grep -qE "^unsetopt ${opt}( |$)" "$HOME/.zshrc" || {
              echo "unsetopt $opt is missing from .zshrc" >&2; exit 1; }
          done
          grep -q "^WORDCHARS=''" "$HOME/.zshrc"

          # And assert them in a shell that has actually read the file. The
          # timeout is because a hung interactive shell would otherwise run to
          # the job limit.
          timeout 120 zsh -ic '
            for o in interactive_comments multios long_list_jobs pushdminus \
                     prompt_subst auto_menu complete_in_word always_to_end; do
              [[ -o $o ]] || { print -u2 "option $o is off"; exit 1 }
            done
            for o in menu_complete flowcontrol; do
              [[ -o $o ]] && { print -u2 "option $o is on"; exit 1 }
            done
            [[ -z $WORDCHARS ]] || { print -u2 "WORDCHARS is not empty"; exit 1 }
            print "shell options ok"
          '

          # The paste that found this: a trailing comment must be a comment.
          test "$(timeout 60 zsh -ic 'echo ok # trailing comment' 2>/dev/null | tail -1)" = ok

      - name: Theme renders and switches
        run: |
          set -eux
          nvim_theme="$HOME/.config/nvim/lua/plugins/ui/colorscheme.lua"

          # Rosé Pine, the scheme with a full set of ports.
          grep -q 'rose-pine-main' "$nvim_theme"
          grep -q 'rose-pine/neovim' "$nvim_theme"
          grep -q 'include rose-pine$' "$HOME/.config/zathura/zathurarc"
          # starship.toml was a symlink into the fork until 2026-09-19. It is a
          # rendered file now, so the variant shows in the palette it selects.
          test ! -L "$HOME/.config/starship.toml"
          grep -q '^palette = "rose-pine"$' "$HOME/.config/starship.toml"

          # The fetched theme files go to a fixed name, so the configs that
          # read them never mention a variant.
          grep -q '^color_theme = "current"$' "$HOME/.config/btop/btop.conf"
          grep -q 'current-theme.toml' "$HOME/.config/alacritty/alacritty.toml"
          test -s "$HOME/.config/btop/themes/current.theme"
          test -s "$HOME/.config/alacritty/current-theme.toml"
          test -s "$HOME/.config/kitty/current-theme.conf"

          # A variant switch within the scheme.
          "$HOME/.local/bin/theme" rose-pine-dawn
          grep -q 'rose-pine-dawn' "$nvim_theme"
          grep -q 'include rose-pine-dawn$' "$HOME/.config/zathura/zathurarc"
          grep -q '^palette = "rose-pine-dawn"$' "$HOME/.config/starship.toml"
          chezmoi verify

      # Catppuccin is the second scheme, and the one that proves a scheme is
      # data rather than a special case. It had no starship port while the
      # prompt came from a checkout; now that the prompt renders from theme
      # data it has one like any other, so starship.toml stays managed across
      # the switch and only the palette it selects changes.
      - name: A second colour scheme needs no new template
        run: |
          set -eux
          nvim_theme="$HOME/.config/nvim/lua/plugins/ui/colorscheme.lua"

          "$HOME/.local/bin/theme" catppuccin-mocha
          grep -q 'catppuccin-mocha' "$nvim_theme"
          grep -q 'catppuccin/nvim' "$nvim_theme"
          grep -q 'include catppuccin-mocha$' "$HOME/.config/zathura/zathurarc"
          grep -q '1e1e2e' "$HOME/.config/btop/themes/current.theme"
          test "$(chezmoi managed | grep -c '^\.config/starship\.toml$')" -eq 1
          grep -q '^palette = "catppuccin-mocha"$' "$HOME/.config/starship.toml"
          chezmoi verify

          # And back.
          "$HOME/.local/bin/theme" rose-pine
          test "$(chezmoi managed | grep -c '^\.config/starship\.toml$')" -eq 1
          grep -q '^palette = "rose-pine"$' "$HOME/.config/starship.toml"
          chezmoi verify

      # Driven by a stored config rather than by --promptString, because
      # promptStringOnce returns the value already in the config and ignores
      # the flag entirely once one is recorded. Asserting it with a flag passes
      # for the wrong reason.
      - name: An unknown theme fails at init, and says what the valid ones are
        run: |
          set -eux
          src="$HOME/.local/share/chezmoi"
          cfg="$HOME/.config/chezmoi/chezmoi.toml"

          sed 's/theme = "[^"]*"/theme = "not-a-theme"/' "$cfg" > /tmp/cfg-bad.toml
          if chezmoi --config /tmp/cfg-bad.toml --config-format toml \
              execute-template --init < "$src/.chezmoi.toml.tmpl" 2>/tmp/err; then
            echo "expected an unknown theme to fail" >&2
            exit 1
          fi
          grep -q 'unknown theme' /tmp/err
          grep -q 'catppuccin-mocha' /tmp/err

      # `ageRecipient` in .chezmoidata/secrets.toml is the switch, and it has
      # been filled in since 2026-09-19, so neither state can be read off the
      # repository's own default any more: this renders both.
      #
      # The ordering assertion is the important one. A bare key after a table
      # header belongs to that table in TOML, so `encryption` below [data]
      # silently becomes data.encryption and chezmoi carries on unencrypted
      # with only a warning.
      - name: Encryption is off when unkeyed, and top-level when on
        run: |
          set -eux
          src="$HOME/.local/share/chezmoi"
          data="$src/.chezmoidata/secrets.toml"
          cp "$data" /tmp/secrets.toml.orig

          render() {
            chezmoi execute-template --init \
              --promptString machine=container \
              --promptString theme=rose-pine \
              < "$src/.chezmoi.toml.tmpl"
          }

          # No recipient: a machine without the key must still apply the rest.
          sed -i 's/^ageRecipient = .*/ageRecipient = ""/' "$data"
          render > /tmp/cfg-off.toml
          grep -qi 'no encryption' /tmp/cfg-off.toml
          ! grep -q '^encryption' /tmp/cfg-off.toml
          ! grep -q '^\[age\]' /tmp/cfg-off.toml

          # Recipient present: the whole mechanism switches on.
          sed -i 's/^ageRecipient = .*/ageRecipient = "age1ci0000000000000000000000000000000000000000000000000000"/' "$data"
          render > /tmp/cfg-on.toml
          grep -q '^encryption = "age"$' /tmp/cfg-on.toml
          grep -q '^\[age\]$' /tmp/cfg-on.toml
          grep -q 'age1ci0000' /tmp/cfg-on.toml

          enc=$(grep -n '^encryption = "age"$' /tmp/cfg-on.toml | cut -d: -f1)
          dat=$(grep -n '^\[data\]$' /tmp/cfg-on.toml | cut -d: -f1)
          test "$enc" -lt "$dat"

          # Restored with a copy rather than `git checkout`: the source is a
          # `cp -a` of the checkout, so its ownership does not match the
          # container user and git refuses to work in it at all. Later steps
          # need the real recipient back, so this cannot just be skipped.
          cp /tmp/secrets.toml.orig "$data"

      # Same TOML hazard as the encryption block, in a second file. sicc is the
      # only machine that sets both a relocated channel index and detached
      # environments, so it is the only render where the order can go wrong: a
      # bare key below [cache] becomes cache.detached-environments and pixi
      # keeps putting environments beside every workspace while looking
      # configured.
      - name: The pixi config keeps bare keys above its tables
        run: |
          set -eux
          src="$HOME/.local/share/chezmoi"
          sed 's/machine = "container"/machine = "sicc"/' \
            "$HOME/.config/chezmoi/chezmoi.toml" > /tmp/cfg-sicc.toml
          chezmoi --config /tmp/cfg-sicc.toml --config-format toml \
            execute-template < "$src/private_dot_config/pixi/config.toml.tmpl" \
            > /tmp/pixi-sicc.toml

          grep -q '^detached-environments = ' /tmp/pixi-sicc.toml
          grep -q '^\[cache\]$' /tmp/pixi-sicc.toml
          det=$(grep -n '^detached-environments = ' /tmp/pixi-sicc.toml | cut -d: -f1)
          cache=$(grep -n '^\[cache\]$' /tmp/pixi-sicc.toml | cut -d: -f1)
          test "$det" -lt "$cache"

          # And a machine with no overrides gets a file with no settings at all,
          # rather than an empty or malformed one.
          chezmoi execute-template \
            < "$src/private_dot_config/pixi/config.toml.tmpl" > /tmp/pixi-container.toml
          ! grep -qE '^[a-z[]' /tmp/pixi-container.toml

      # A machine with no age identity has to apply everything that is not
      # encrypted, and it is not enough to check that the apply exits zero.
      #
      # chezmoi aborts on a decryption failure rather than skipping the entry,
      # so every target sorting after the failed one is left untouched, and
      # .ssh/config sorts before .zshrc. The first version of this stopped at
      # ~/.ssh and silently left the shell config stale. .chezmoiignore now
      # drops the encrypted entries when the identity is absent, and the test
      # for that is a target that sorts after the encrypted one.
      - name: A machine with no key applies everything else, in full
        run: |
          set -eux
          rm -f "$HOME/.config/chezmoi/key.txt"

          chezmoi init --apply --promptString machine=container --promptString theme=rose-pine
          chezmoi verify

          # Sorts after .ssh/config, so it is the one that would go missing.
          test -f "$HOME/.zshrc"
          test -f "$HOME/.bashrc"
          test -f "$HOME/.config/sheldon/plugins.toml"
          test -x "$HOME/.local/bin/theme"

          # The encrypted entry is absent rather than half-written, and no
          # plaintext stand-in was left in its place.
          test ! -e "$HOME/.ssh/config"
          test ! -f "$HOME/.config/chezmoi/key.txt"
