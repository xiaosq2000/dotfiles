{{- $t := index .themes .theme -}}
{{- $s := index .schemes $t.scheme -}}
# Replaces .gitmodules, and carries the per-scheme theme files.
#
# A submodule pins a commit that only moves when you remember to bump it. An
# external clones on first apply and pulls on refresh, so theme files arrive on
# every machine without a separate step.
#
# This file is always treated as a template, with or without a .tmpl suffix.
#
# Theme files are fetched rather than vendored, and always to a fixed
# `current-*` name. Vendoring meant one committed copy per variant per tool,
# which is how the dark kitty copy came to have color7 and color15 set to
# #575279 — Dawn's foreground, rendering white and bright-white as dark purple
# in dark mode — and it put the whole job of supporting a second colour scheme
# into hand-copying twelve more files. Fetching to a fixed name also means
# switching variant rewrites one file instead of leaving the previous variant's
# copy behind for btop and alacritty to keep finding.
#
# Scheme: {{ $s.description }}
# Variant: {{ .theme }} — {{ $t.description }} ({{ $t.appearance }})

[".config/kitty/current-theme.conf"]
type = "file"
url = {{ printf $s.kittyURL $t.kitty | quote }}
refreshPeriod = "672h"

[".config/btop/themes/current.theme"]
type = "file"
url = {{ printf $s.btopURL $t.btop | quote }}
refreshPeriod = "672h"

[".config/alacritty/current-theme.toml"]
type = "file"
url = {{ printf $s.alacrittyURL $t.alacritty | quote }}
refreshPeriod = "672h"

# No starship entry. The prompt is rendered by
# private_dot_config/starship.toml.tmpl from the palette in .chezmoidata, so
# there is nothing to check out and no scheme that can be missing a port.

# tpm, the tmux plugin manager. tmux.conf's last line runs
# ${XDG_DATA_HOME}/tmux/plugins/tpm/tpm, and every `set -g @plugin` above it is
# inert without that clone, so a machine missing tpm has a tmux with no plugins
# and no error to explain it. This workstation was in exactly that state on
# 2026-09-18.
#
# It was a 31-line setup.d installer that deleted the directory and re-cloned it
# on every run, which is also why tpm's own record of installed plugins never
# survived. An external clones once and pulls on refresh.
[".local/share/tmux/plugins/tpm"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tpm"
refreshPeriod = "672h"
