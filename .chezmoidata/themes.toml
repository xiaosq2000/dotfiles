# Rosé Pine variants, and the name each tool knows them by.
#
# This table replaces the `theme/light` branch. Previously main carried the
# dark variant and theme/light carried dawn, which meant every non-theme
# commit had to be landed twice; they drifted anyway, stranding the
# set_docker_proxy fix on theme/light for months. Now one `theme` value in
# ~/.config/chezmoi/chezmoi.toml selects a column here and every file below
# is rendered from it.
#
# `moon` was never a branch: all three colour strings were already sitting in
# .zshrc with two of them commented out, so supporting it costs nothing.
#
# Adding a tool means adding one key here and one template reference. Do not
# hard-code a variant name in a config file.

[themes.main]
description = "Rosé Pine — the dark original"
# .config/btop/btop.conf -> color_theme
btop = "rose-pine"
# rose-pine/kitty dist file, fetched as an external
kitty = "rose-pine"
# the name kitty writes in its BEGIN_KITTY_THEME block
kittyName = "Rosé Pine"
# the colorscheme name the rose-pine.nvim plugin registers
nvim = "rose-pine-main"
# basename under .config/themes/rose-pine/starship
starship = "rose-pine"
# basename under .config/alacritty
alacritty = "rose-pine"
fzf = "--color=fg:#908caa,bg:#191724,hl:#ebbcba --color=fg+:#e0def4,bg+:#26233a,hl+:#ebbcba --color=border:#403d52,header:#31748f,gutter:#191724 --color=spinner:#f6c177,info:#9ccfd8 --color=pointer:#c4a7e7,marker:#eb6f92,prompt:#908caa"

[themes.moon]
description = "Rosé Pine Moon — dark, lower contrast"
btop = "rose-pine-moon"
kitty = "rose-pine-moon"
kittyName = "Rosé Pine Moon"
nvim = "rose-pine-moon"
starship = "rose-pine-moon"
alacritty = "rose-pine-moon"
fzf = "--color=fg:#908caa,bg:#232136,hl:#ea9a97 --color=fg+:#e0def4,bg+:#393552,hl+:#ea9a97 --color=border:#44415a,header:#3e8fb0,gutter:#232136 --color=spinner:#f6c177,info:#9ccfd8 --color=pointer:#c4a7e7,marker:#eb6f92,prompt:#908caa"

[themes.dawn]
description = "Rosé Pine Dawn — the light variant, formerly the theme/light branch"
btop = "rose-pine-dawn"
kitty = "rose-pine-dawn"
kittyName = "Rosé Pine Dawn"
nvim = "rose-pine-dawn"
starship = "rose-pine-dawn"
alacritty = "rose-pine-dawn"
fzf = "--color=fg:#797593,bg:#faf4ed,hl:#d7827e --color=fg+:#575279,bg+:#f2e9e1,hl+:#d7827e --color=border:#dfdad9,header:#286983,gutter:#faf4ed --color=spinner:#ea9d34,info:#56949f --color=pointer:#907aa9,marker:#b4637a,prompt:#797593"
