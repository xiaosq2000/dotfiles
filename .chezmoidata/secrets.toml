# Where the encryption key comes from. No secret is in this file.
#
# The design, and the commands to turn it on, are in docs/secrets.md. The short
# version: files in this repository whose names begin with `encrypted_` are age
# ciphertext, chezmoi decrypts them on apply, and the private key is not here.
# It lives at ageIdentity on each machine, and a copy lives in Bitwarden so that
# a new machine can fetch it once.
#
# Why this exists at all. ~/.secrets is a git repository with no remote, so the
# SSH config and the API tokens in it exist on exactly one disk. Encrypted
# copies in this repository get pushed to GitHub with everything else, and the
# only thing that must not be lost is a single key that Bitwarden already
# backs up.
#
# ageRecipient empty means encryption is off: the chezmoi config omits its
# [age] section entirely, so a machine without the key still applies
# everything else. Filling it in is what switches the whole mechanism on.

[secrets]
# The age public key, as `age-keygen -y` prints it. Safe to commit: a recipient
# can only encrypt. Empty until the key exists; see docs/secrets.md.
ageRecipient = "age1ke4rf2jsnvfhrxy9m8lqfae3u9lcdv8mdanf4h9dh7gyeldeev6qgx6hw8"

# Where the private identity lives, relative to $HOME. Never committed, and
# ignored by .chezmoiignore so that a stray `chezmoi add` cannot pull it in.
ageIdentity = ".config/chezmoi/key.txt"

# The Bitwarden entry holding a copy of the identity, and the field to read it
# from. An empty field means the entry's password, which is where a one-line
# AGE-SECRET-KEY belongs.
bitwardenItem = "chezmoi age identity"
bitwardenField = ""
