# Catppuccin, the second scheme, and the one that proves the structure.
#
# It is here because the repository already carried four Catppuccin zathura
# files that nothing could select: zathurarc had `include rose-pine-dawn`
# hard-coded, so zathura sat on the light Rosé Pine theme no matter what the
# rest of the machine was set to.
#
# It also demonstrates why the per-tool tokens below cannot be derived from the
# variant slug the way Rosé Pine's can:
#
#   btop       catppuccin_mocha    scheme prefix, underscore
#   kitty      mocha               no prefix
#   alacritty  catppuccin-mocha    scheme prefix, hyphen
#   nvim       catppuccin-mocha
#   zathura    catppuccin-mocha    the files already in this repository
#
# Coverage is honest rather than complete. Starship has no entry, because the
# starship configs come from a personal fork that only carries Rosé Pine, so
# selecting a Catppuccin variant leaves ~/.config/starship.toml unmanaged and
# starship uses its own defaults. `theme` prints which tools a variant covers.
#
# The fzf palettes are Catppuccin's own fzf port rather than a reading of the
# base palette, so they match what the scheme's authors intended.

[schemes.catppuccin]
description = "Catppuccin — soothing pastel theme"
btopURL = "https://raw.githubusercontent.com/catppuccin/btop/main/themes/%s.theme"
kittyURL = "https://raw.githubusercontent.com/catppuccin/kitty/main/themes/%s.conf"
alacrittyURL = "https://raw.githubusercontent.com/catppuccin/alacritty/main/%s.toml"
nvimRepo = "catppuccin/nvim"
nvimName = "catppuccin"
# No starship port in the fork this repository checks out.
starshipDir = ""

[themes.catppuccin-mocha]
scheme = "catppuccin"
description = "Catppuccin Mocha — the darkest variant"
appearance = "dark"
btop = "catppuccin_mocha"
kitty = "mocha"
kittyName = "Catppuccin Mocha"
alacritty = "catppuccin-mocha"
nvim = "catppuccin-mocha"
starship = ""
zathura = "catppuccin-mocha"

[themes.catppuccin-mocha.fzf]
fg = "#cdd6f4"
bg = "#1e1e2e"
