[mise.marksman]
tool = "aqua:artempyanykh/marksman"

[mise.stylua]
tool = "aqua:JohnnyMorganz/StyLua"

[mise.shfmt]
tool = "aqua:mvdan/sh"

[mise.bash-language-server]
tool = "npm:bash-language-server"

[mise.yaml-language-server]
