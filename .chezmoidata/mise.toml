# Cross-platform CLIs, language runtimes, LSPs, and coding agents managed by
# `mise`. Versions follow upstream latest by default (`lockfile = false`,
# verified by mise's built-in SLSA / cosign / GitHub attestation / npm
# provenance checks; existing installed copies stay put until upgraded).
#
# A bundle in .chezmoidata/tools.toml selects entries by id; chezmoi renders
# ~/.config/mise/config.toml and runs `mise install`.
# Optional fields:
#   version         explicit version or track (defaults to "latest"; e.g. "lts")
#   bin             shim/binary name checked by `dotfiles doctor` (defaults to id)
#   version_prefix  tag prefix passed through to mise (e.g. "cli-v")
#
# Upgrade anytime on any host with `dotfiles upgrade` (or `mise upgrade [tool]`).
# Checked on 2026-11-20.

################################################################################
# Core shell, editor, navigation, and repo guardrails
################################################################################

[mise.dotfiles-cli]
tool = "github:xiaosq2000/dotfiles"
version_prefix = "cli-v"
bin = "dotfiles"

[mise.sheldon]
tool = "aqua:rossmacarthur/sheldon"

[mise.neovim]
tool = "aqua:neovim/neovim"
bin = "nvim"

[mise.tree-sitter]
tool = "aqua:tree-sitter/tree-sitter"

[mise.fzf]
tool = "aqua:junegunn/fzf"

[mise.starship]
tool = "aqua:starship/starship"

[mise.eza]
tool = "aqua:eza-community/eza"

[mise.ripgrep]
tool = "aqua:BurntSushi/ripgrep"
bin = "rg"

[mise.fd]
tool = "aqua:sharkdp/fd"

[mise.jq]
tool = "aqua:jqlang/jq"

[mise.yazi]
tool = "aqua:sxyazi/yazi"

[mise.tmux]
tool = "aqua:tmux/tmux-builds"

[mise.btop]
tool = "aqua:aristocratos/btop"

[mise.dust]
tool = "aqua:bootandy/dust"

[mise.7zip]
tool = "aqua:ip7z/7zip"
bin = "7zz"

[mise.git-lfs]
tool = "aqua:git-lfs/git-lfs"

[mise.lazygit]
tool = "aqua:jesseduffield/lazygit"

[mise.difftastic]
tool = "aqua:Wilfred/difftastic"
bin = "difft"

[mise.pre-commit]
tool = "aqua:pre-commit/pre-commit"

[mise.shellcheck]
tool = "aqua:koalaman/shellcheck"

[mise.gitleaks]
tool = "aqua:gitleaks/gitleaks"

[mise.zoxide]
tool = "aqua:ajeetdsouza/zoxide"

################################################################################
# Language runtimes, build systems, and formatters
################################################################################

[mise.cmake]
tool = "aqua:Kitware/CMake"

[mise.ninja]
