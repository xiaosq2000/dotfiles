# Machine names are stable identities selected at init. Hostname patterns only
# suggest the initial answer; templates always look up the selected machine.
# Bundles describe software and desktop roles, while the remaining fields
# describe machine capabilities and storage.
#
# This repository is public. Addresses, account names and tokens belong in the
# encrypted machines skill. Filesystem paths below are the deliberate exception
# explained in docs/secrets.md: cache locations must work before a key exists.

################################################################################
# Fields
#
#   description            one line, shown by `machine` and in `chezmoi data`
#   hostnamePattern        regex; supplies the default answer at init only
#   bundles                names from .chezmoidata/tools.toml; renders the pixi
#                          global manifest and selects external resources
#   sudo                   whether root is available, for hints rather than for
#                          anything this repository runs
#   docs                   the machine's page, relative to $HOME; present only
#                          where the age key is, since it is decrypted on apply
#   pixi.cacheDir          relocate ~/.cache/rattler here; empty means leave it
#   pixi.detachedEnvironments
#                          put workspace .pixi/envs here; empty means leave them
#                          beside each workspace
#   pixi.repodataDir       where to keep the channel index; empty means leave it
#                          inside the package cache
#
# On the two pixi keys: set them together or not at all. rattler hardlinks
# package files out of the cache into an environment, which only works within
# one filesystem. Moving the cache away from the environments turns every
# install into a full copy, so relocating only one of the two can cost more
# space than relocating neither.
################################################################################

[machines.workstation]
description = "IMRL desktop, Lenovo ThinkStation P3 Tower, one RTX 4080"
hostnamePattern = "^shuqixiao-ThinkStation-P3-Tower$"
bundles = [
    "core",
    "dev-c",
    "dev-py",
    "dev-web",
    "dev-tex",
    "lsp",
    "media",
    "ml",
    "secrets",
    "github",
    "extras",
    "desktop",
    "fonts",
    "research",
]
sudo = true
docs = ".agents/skills/machines/references/workstation.md"
# Home is on a local NVMe with room to spare, so pixi's defaults are right.
[machines.workstation.pixi]
cacheDir = ""
detachedEnvironments = ""
repodataDir = ""

[machines.laptop]
description = "Lenovo Legion Y9000P IAH7H, one RTX 3070 Ti, works off campus"
hostnamePattern = "^shuqixiao-Legion-Y9000P-IAH7H$"
bundles = [
    "core",
    "dev-c",
    "dev-py",
    "dev-web",
    "dev-tex",
    "lsp",
    "media",
    "ml",
    "secrets",
    "github",
    "extras",
    "desktop",
    "fonts",
    "research",
]
sudo = true
docs = ".agents/skills/machines/references/laptop.md"
# One 468 GB volume holds home, the checkout and the environments. Worth
# watching, but still local and still one filesystem.
[machines.laptop.pixi]
cacheDir = ""
detachedEnvironments = ""
repodataDir = ""

[machines.imrl]
description = "Shared IMRL lab server, six RTX 4090s, hosts the lab Gitea"
hostnamePattern = "^capios-SYS-420GP-TNR$"
bundles = [
    "core",
    "dev-c",
    "dev-py",
    "dev-web",
    "dev-tex",
    "lsp",
    "media",
    "ml",
    "secrets",
    "github",
    "extras",
]
sudo = true
# Shared and headless: reached over SSH, so no terminal emulator or font cache.
docs = ".agents/skills/machines/references/imrl.md"
# Measured 2026-09-18: 31 GB of package cache in home, on a root filesystem 89%
# full with 208 GB left, while the volume carrying DATA_ROOT had 1.5 TB free.
# Global environments were 718 MB and no workspace had an environment here, so
# relocating both costs almost nothing to redo. Both keys point at the same
# volume so cache and environments stay on one filesystem.
[machines.imrl.pixi]
cacheDir = "/mnt/ec4204bf-b34a-4323-9b84-ea17f540a636/xsq.d/pixi/rattler"
detachedEnvironments = "/mnt/ec4204bf-b34a-4323-9b84-ea17f540a636/xsq.d/pixi/envs"
# The volume above is a local NVMe, so pixi leaves the channel index where it is.
repodataDir = ""

[machines.sicc]
description = "University of Macau SICC cluster login node, Slurm, no sudo"
# login01, login02, ... Which one you land on is not stable.
hostnamePattern = "^login[0-9]+$"
# Deliberately short. This is a shared login node that runs editing, git and
# job submission; anything heavier belongs in a Slurm allocation, and anything
# project-specific belongs in the workspace's own pixi environment.
bundles = ["core", "dev-py", "ml", "secrets", "github"]
sudo = false
docs = ".agents/skills/machines/references/sicc.md"
# Measured 2026-09-18: home is NFS with a 200 GB quota and held 36 GB, of which
# 18 GB was package cache. Global environments were 718 MB and the embodied-ai
# workspace 1.2 GB, so the cache alone was half of everything in home and
# relocating the environments with it costs 2 GB to redo. /data is the group's
# allocation on a different NFS server, and the directory below already carries
# the setgid bit that keeps new files in group_huikong.
[machines.sicc.pixi]
cacheDir = "/data/huikong/shuqixiao/pixi/rattler"
detachedEnvironments = "/data/huikong/shuqixiao/pixi/envs"
# Both paths above are NFS, and pixi will not keep the channel index on a
# network filesystem: it detects one and redirects the index to node-local /tmp
# for that run, printing a paragraph of warning every time. Saying so explicitly
# silences it and makes the location deterministic instead of a side effect of
# pixi's filesystem detection. /tmp is per node and is meant to be discarded.
repodataDir = "/tmp/pixi-repodata"

[machines.vps]
description = "Public VPS, reverse proxy and network plumbing"
hostnamePattern = ""
bundles = ["core"]
sudo = true
# The page exists in the repository but never lands on the vps itself, which
# never gets the age key.
docs = ".agents/skills/machines/references/vps.md"
[machines.vps.pixi]
cacheDir = ""
detachedEnvironments = ""
repodataDir = ""

# Used by the bootstrap job in CI, and by any throwaway container. No bundles,
# so `chezmoi init --apply` installs nothing over the network and the job stays
# fast enough to gate every push.
[machines.container]
description = "Throwaway container; config files only, no tool chain"
hostnamePattern = ""
bundles = []
sudo = true
docs = ""
[machines.container.pixi]
cacheDir = ""
detachedEnvironments = ""
repodataDir = ""

# The fallback when no hostname matches. Deliberately minimal: a new machine
# gets a working shell, and you add a real entry above once you know what the
# machine is for.
[machines.generic]
description = "Unrecognised machine; a working shell and nothing assumed"
hostnamePattern = ""
bundles = ["core"]
sudo = false
docs = ""
[machines.generic.pixi]
cacheDir = ""
detachedEnvironments = ""
repodataDir = ""
