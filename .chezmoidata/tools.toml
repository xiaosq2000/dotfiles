# Named software bundles combining four complementary layers:
#
#   packages         conda-forge / source-built pixi global environments (kept slim
#                    for rootless HPC ABI strongholds, C/C++ shared-lib tools, Python
#                    CLI packages, and git-built recipes like um-vpn)
#   mise             cross-platform CLIs, runtimes, LSPs, and coding agents from
#                    .chezmoidata/mise.toml (floating latest, upgraded locally via
#                    dotfiles upgrade)
#   downloads        non-CLI GUI bundles, fonts, Zotero .xpi plugins, and agy manifest
#                    from .chezmoidata/downloads.toml (installed by dotfiles-fetch)
#   system_packages  distro packages installed automatically on hosts with sudo = true
#                    during `sudo -v && chezmoi apply` (skipped on rootless hosts)
#   config           destination paths deployed only when the bundle is selected
#
# Five capability layers cover the entire fleet:
#   core      universal terminal base (safe on public VPS and unknown hosts)
#   secrets   identity, encryption, vault, and GitHub auth (never on public VPS)
#   dev       full development, ML, LSPs, 4 coding agents, and Herdr
#   desktop   GUI apps (kitty, zathura, fcitx5), keyd/logid, 19 font families, and Zotero
#   laptop    off-campus VPN and battery refresh-rate service
#
# Checked on 2026-11-22.

################################################################################
# Bundles
################################################################################

[bundles.core]
description = "Shell, editor, navigation, and dotfiles CLI. Every machine, including VPS and login nodes."
packages = [
    "chezmoi",
    "mise",
    "zsh",
    "mosh",
    "sqlite",
]
mise = [
    "dotfiles-cli",
    "sheldon",
    "neovim",
    "tree-sitter",
    "fzf",
    "starship",
    "eza",
    "ripgrep",
    "fd",
    "jq",
    "yazi",
    "tmux",
    "btop",
    "dust",
    "7zip",
    "git-lfs",
    "lazygit",
    "difftastic",
    "pre-commit",
    "shellcheck",
    "gitleaks",
    "zoxide",
]

[bundles.secrets]
description = "Encryption, password vault, and GitHub CLI auth boundary (trusted machines only; never on VPS)."
packages = [
    "rbw",
    "libsecret",
]
mise = [
    "age",
    "sops",
    "gh",
]

[bundles.dev]
description = "Full development, Python/ML, C++/Web/LaTeX, LSPs, 4-agent control plane, and Herdr."
packages = [
    "clang-format",
    "clang-tools",
    "cmake-language-server",
    "codespell",
    "ffmpeg",
    "huggingface_hub",
    "speedtest-cli",
    "git-filter-repo",
]
mise = [
    # 4 coding agents and workspace manager
    "codex",
    "claude-code",
    "pi",
    "rtk",
    "herdr",
    # Language runtimes, build systems, and formatters
    "uv",
    "ruff",
    "ty",
    "node",
    "pnpm",
    "deno",
    "prettierd",
    "cmake",
    "ninja",
    "tex-fmt",
    # Language servers and linters
    "lua-language-server",
    "taplo",
    "marksman",
    "stylua",
    "shfmt",
    "bash-language-server",
    "yaml-language-server",
    "vscode-langservers-extracted",
    "dockerfile-language-server-nodejs",
    # Diagnostics and convenience
    "tre",
    "fastfetch",
    "lazydocker",
]
downloads = ["agy"]
system_packages = ["bubblewrap"]
config = [
    ".claude",
    ".codex",
    ".gemini",
    ".pi",
    ".config/herdr/config.toml",
    ".config/tex-fmt",
    ".latexmkrc",
]

[bundles.desktop]
description = "Desktop GUI (kitty, zathura, fcitx5), keyd/logid, 19 font families, and Zotero with plugins."
packages = []
mise = [
    "zotero-mcp-server",
]
downloads = [
    "kitty",
    "maple-mono",
    "fira", "nerd-font-fira-code", "tex-gyre-pagella", "libertinus",
    "source-sans", "source-serif", "source-han-sans-sc", "source-han-serif-cn",
    "apple-color-emoji", "noto-color-emoji", "san-francisco-pro",
    "san-francisco-mono", "new-york", "pingfang",
    "newsreader", "inter", "jetbrains-mono", "noto-sans-math",
    "zotero",
    "better-bibtex",
    "extra-meta",
    "arxiv-workflow",
]
system_packages = [
    "keyd",
    "zathura",
    "fcitx5",
    "fcitx5-pinyin",
    "libnotify",
    "logiops",
]
config = [
    ".config/kitty",
    ".config/zathura",
    ".config/fcitx5",
    ".config/environment.d/im.conf",
    ".config/autostart/org.fcitx.Fcitx5.desktop",
    ".config/systemd/user/wayland-xhost.service",
    ".config/systemd/user/graphical-session.target.wants/wayland-xhost.service",
    ".local/bin/zathura",
    ".local/bin/zotero-pmlr",
    ".agents/skills/zotero-pmlr",
    ".config/dotfiles/zotero-user.js",
]

[bundles.laptop]
description = "Laptop mobility: university VPN client and battery panel refresh-rate service."
packages = ["um-vpn"]
# The refresh-rate service watches UPower over the system bus and changes mode
# through mutter over the session bus using system python3 with gi bindings.
config = [
    ".local/libexec/dotfiles/refresh-rate-on-power",
    ".config/systemd/user/refresh-rate-on-power.service",
    ".config/systemd/user/graphical-session.target.wants/refresh-rate-on-power.service",
]

################################################################################
# Exposed pixi binaries
#
# A package with no entry here exposes exactly one binary, named after the
# package. Only the exceptions are listed.
################################################################################

[packages.sqlite]
exposed = ["sqlite3"]

[packages.mosh]
# The launcher calls mosh-client, and remote sessions need mosh-server.
exposed = ["mosh", "mosh-client", "mosh-server"]

[packages.clang-tools]
# Deliberately four of the sixty binaries this package ships. The rest are
# either versioned duplicates (clang-tidy-23 beside clang-tidy) or tools no
# editor here calls.
exposed = [
    "clangd",
    "clang-tidy",
    "clang-apply-replacements",
    "run-clang-tidy",
]

[packages.ffmpeg]
exposed = ["ffmpeg", "ffplay", "ffprobe"]

[packages.rbw]
exposed = ["rbw", "rbw-agent"]

[packages.libsecret]
exposed = ["secret-tool"]

[packages.um-vpn]
# conda-forge does not package um-vpn, so pixi builds it from its repository.
# The environment brings its own secret-tool for the stored UMPASS sign-in.
git = "https://github.com/xiaosq2000/um-vpn"
exposed = ["um-vpn"]

[packages.speedtest-cli]
exposed = ["speedtest", "speedtest-cli"]

[packages.huggingface_hub]
exposed = ["hf", "huggingface-cli", "tiny-agents"]

[packages.zsh]
# The package also ships a zsh-5.9 binary; expose only `zsh` so upgrades keep matching.
exposed = ["zsh"]

################################################################################
# Distribution system packages (sudo hosts only)
#
# Checked on 2026-11-22 on Ubuntu 26.04 (resolute). Each entry declares
# architecture-independent `probe` paths checked via `stat` (if any path exists,
# the entry is treated as installed, preserving source-built binaries such as
# /usr/local/bin/logid), per-distro package arrays (`apt`, `dnf`, `pacman`,
# `zypper`), and an optional systemd unit to enable once installed.
################################################################################

[system_packages.keyd]
description = "System-wide HHKB keyboard remapping daemon"
probe = ["/usr/bin/keyd.rvaiya", "/usr/bin/keyd", "/usr/local/bin/keyd"]
apt = ["keyd"]
dnf = ["keyd"]
pacman = ["keyd"]
zypper = ["keyd"]
enable_unit = "keyd.service"

[system_packages.zathura]
description = "Minimalist PDF viewer with poppler backend"
probe = ["/usr/bin/zathura", "/usr/local/bin/zathura"]
apt = ["zathura", "zathura-pdf-poppler"]
dnf = ["zathura", "zathura-pdf-poppler"]
pacman = ["zathura", "zathura-pdf-poppler"]
zypper = ["zathura", "zathura-plugin-pdf-poppler"]

[system_packages.fcitx5]
description = "Fcitx5 input method framework with GTK/Qt frontends and config UI"
probe = ["/usr/bin/fcitx5", "/usr/local/bin/fcitx5"]
apt = ["fcitx5", "fcitx5-frontend-all", "fcitx5-config-qt"]
dnf = ["fcitx5", "fcitx5-gtk", "fcitx5-qt", "fcitx5-configtool"]
pacman = ["fcitx5", "fcitx5-gtk", "fcitx5-qt", "fcitx5-configtool"]
zypper = ["fcitx5", "fcitx5-gtk", "fcitx5-qt", "fcitx5-configtool"]

[system_packages.fcitx5-pinyin]
description = "Fcitx5 Chinese addons (pinyin and punctuation modules)"
probe = ["/usr/share/fcitx5/inputmethod/pinyin.conf"]
apt = ["fcitx5-chinese-addons"]
dnf = ["fcitx5-chinese-addons"]
pacman = ["fcitx5-chinese-addons"]
zypper = ["fcitx5-chinese-addons"]

[system_packages.libnotify]
description = "Desktop notifications (notify-send) for agent-notify and dotfiles host"
probe = ["/usr/bin/notify-send", "/usr/local/bin/notify-send"]
apt = ["libnotify-bin"]
dnf = ["libnotify"]
pacman = ["libnotify"]
zypper = ["libnotify-tools"]

[system_packages.logiops]
description = "Logitech HID++ daemon (logid) for MX mice (MX Master 3, MX Anywhere 2S)"
probe = ["/usr/local/bin/logid", "/usr/bin/logid"]
apt = ["logiops"]
dnf = ["logiops"]
pacman = ["logiops"]
zypper = ["logiops"]
enable_unit = "logid.service"

[system_packages.bubblewrap]
description = "Primary unprivileged mount-namespace backend for agent-jail"
probe = ["/usr/bin/bwrap", "/usr/local/bin/bwrap"]
apt = ["bubblewrap"]
dnf = ["bubblewrap"]
pacman = ["bubblewrap"]
zypper = ["bubblewrap"]
