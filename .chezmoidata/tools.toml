# Bundles select Pixi packages and named resources from downloads.toml.
# Edit these declarations rather than running `pixi global install`: the next
# manifest synchronization restores the selected package set.
#
# Each package gets its own environment so one dependency conflict cannot
# affect an entire bundle. Exposure overrides list only the commands we use;
# exposing bundled runtimes such as node or openssl would shadow other tools.

################################################################################
# Bundles
################################################################################

[bundles.core]
externals = ["kitty-terminfo"]
description = "Shell, editor and navigation. Every machine, including a login node."
packages = [
    "chezmoi",
    "zsh",
    "sheldon",
    "nvim",
    # nvim's treesitter config calls treesitter.install(), which shells out to
    # the tree-sitter CLI to build parsers, so it belongs wherever nvim does
    # rather than in the lsp bundle a login node does not take.
    "tree-sitter-cli",
    "fzf",
    "starship",
    "eza",
    "ripgrep",
    "fd-find",
    "jq",
    "yazi",
    "tmux",
    "btop",
    "dust",
    "p7zip",
    "sqlite",
    "git-lfs",
    "lazygit",
    "difftastic",
    "pre-commit",
    "shellcheck",
]

[bundles.dev-c]
description = "C and C++ build and format tooling"
packages = ["cmake", "ninja", "clang-format", "clang-tools"]

[bundles.dev-py]
description = "Python tooling"
packages = ["uv", "ruff", "ty"]

[bundles.dev-web]
description = "Node, Deno and the JavaScript formatters"
packages = ["nodejs", "pnpm", "deno", "prettier"]

[bundles.dev-tex]
description = "LaTeX tooling"
packages = ["tex-fmt"]

[bundles.lsp]
description = "Language servers and the external binaries Neovim's plugins call"
# Everything here has a matching entry in nvim's lua/plugins/lsp/lspconfig.lua.
# That file falls back to :MasonInstall when a binary is missing, so a machine
# without this bundle still gets working LSP, just installed per machine and
# unmanaged. luarocks is not a server; it is what the Lua plugins shell out to.
# tree-sitter-cli was here and moved to core, because nvim is in core and its
# treesitter config cannot build a parser without it.
packages = [
    "lua-language-server",
    "bash-language-server",
    "yaml-language-server",
    "vscode-langservers-extracted",
    "texlab",
    "marksman",
    "cmake-language-server",
    "taplo",
    "luarocks",
]

[bundles.media]
description = "Audio, video and image conversion, for ~/.sh_utils/tools"
packages = ["ffmpeg", "resvg"]

[bundles.ml]
description = "Model and dataset transfer"
packages = ["huggingface_hub"]

[bundles.secrets]
description = "age, sops and the Bitwarden client; see docs/secrets.md"
packages = ["age", "go-sops", "rbw", "libsecret"]

[bundles.extras]
externals = ["tre"]
description = "Convenience and diagnostics; nothing here is load-bearing"
packages = ["fastfetch", "speedtest-cli", "git-filter-repo", "lazydocker"]

[bundles.desktop]
description = "Kitty, its terminal font, and desktop configuration"
packages = []
externals = ["kitty", "maplemono-nf-cn-unhinted"]

[bundles.fonts]
description = "Document, design, CJK and emoji fonts"
packages = []
externals = [
    "fira", "nerd-font-fira-code", "tex-gyre-pagella", "libertinus",
    "source-sans", "source-serif", "source-han-sans-sc", "source-han-serif-cn",
    "apple-color-emoji", "noto-color-emoji", "san-francisco-pro",
    "san-francisco-mono", "new-york", "pingfang",
]

[bundles.research]
description = "Zotero and its desktop launcher"
packages = []
externals = ["zotero"]

################################################################################
# Exposed binaries
#
# A package with no entry here exposes exactly one binary, named after the
# package. Only the exceptions are listed, which is most of the interesting
# ones. Every list below was read off an installed environment rather than
# guessed, because an inaccurate name fails the sync.
################################################################################

[packages.ripgrep]
exposed = ["rg"]

[packages.fd-find]
exposed = ["fd"]

[packages.p7zip]
exposed = ["7z", "7za", "7zr"]

[packages.sqlite]
exposed = ["sqlite3"]

[packages.yazi]
exposed = ["ya", "yazi"]

[packages.difftastic]
exposed = ["difft"]

[packages.cmake]
exposed = ["ccmake", "cmake", "cpack", "ctest"]

[packages.clang-tools]
# Deliberately four of the sixty binaries this package ships. The rest are
# either versioned duplicates (clang-tidy-23 beside clang-tidy) or tools no
# editor here calls.
exposed = [
    "clangd",
    "clang-tidy",
    "clang-apply-replacements",
    "run-clang-tidy",
]

[packages.uv]
exposed = ["uv", "uvx"]

[packages.nodejs]
exposed = ["node", "npm", "npx"]

[packages.pnpm]
exposed = ["pn", "pnpm", "pnpx", "pnx"]

[packages.vscode-langservers-extracted]
# The package also ships css, html, eslint and markdown servers. Only the JSON
# one is wired up in nvim, and exposing the others would put five more binaries
# on PATH for nothing.
exposed = ["vscode-json-language-server"]

[packages.tree-sitter-cli]
exposed = ["tree-sitter"]

[packages.luarocks]
exposed = ["luarocks", "luarocks-admin"]

[packages.ffmpeg]
exposed = ["ffmpeg", "ffplay", "ffprobe"]

[packages.age]
exposed = ["age", "age-keygen"]

[packages.go-sops]
exposed = ["sops"]

[packages.rbw]
exposed = ["rbw", "rbw-agent"]

[packages.libsecret]
exposed = ["secret-tool"]

[packages.fastfetch]
exposed = ["fastfetch", "flashfetch"]

[packages.speedtest-cli]
exposed = ["speedtest", "speedtest-cli"]

[packages.huggingface_hub]
exposed = ["hf", "huggingface-cli", "tiny-agents"]

[packages.zsh]
# The package also ships a zsh-5.9 binary, and the old hand-held manifest
# exposed it. Exposing a version-numbered name means the manifest stops
# matching the package the day conda-forge ships 5.10.
exposed = ["zsh"]
