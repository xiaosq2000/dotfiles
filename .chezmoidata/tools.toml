# Named software bundles combining three complementary layers:
#
#   packages   conda-forge / source-built pixi global environments (kept slim
#              for rootless HPC ABI strongholds, C/C++ shared-lib tools, Python
#              CLI packages, and git-built recipes like um-vpn)
#   mise       multi-arch SHA-256 locked CLIs, runtimes, LSPs, and coding agents
#              from .chezmoidata/mise.toml (locked in private_dot_config/mise/mise.lock)
#   downloads  non-CLI GUI bundles, fonts, Zotero .xpi plugins, and agy manifest
#              from .chezmoidata/downloads.toml (installed by dotfiles-fetch)
#   config     destination paths deployed only when the bundle is selected
#
# One pixi environment per package keeps dependency solves isolated, and
# `[packages.<name>].exposed` lists exact binaries so bundled runtimes stay off PATH.
# Checked on 2026-11-19.

################################################################################
# Bundles
################################################################################

[bundles.core]
description = "Shell, editor, navigation, and dotfiles CLI. Every machine, including a login node."
packages = [
    "chezmoi",
    "mise",
    "zsh",
    "mosh",
    "sqlite",
]
mise = [
    "dotfiles-cli",
    "sheldon",
    "neovim",
    "tree-sitter",
    "fzf",
    "starship",
    "eza",
    "ripgrep",
    "fd",
    "jq",
    "yazi",
    "tmux",
    "btop",
    "dust",
    "7zip",
    "git-lfs",
    "lazygit",
    "difftastic",
    "pre-commit",
    "shellcheck",
    "gitleaks",
    "zoxide",
]

[bundles.dev-c]
description = "C and C++ build and format tooling"
packages = ["clang-format", "clang-tools"]
mise = ["cmake", "ninja"]

[bundles.dev-py]
description = "Python tooling"
packages = []
mise = ["uv", "ruff", "ty"]

[bundles.dev-web]
description = "Node, pnpm, Deno and JavaScript formatters"
packages = []
mise = ["node", "pnpm", "deno", "prettierd"]

[bundles.dev-tex]
description = "LaTeX tooling"
packages = []
mise = ["tex-fmt"]
config = [".config/tex-fmt", ".latexmkrc"]

[bundles.lsp]
description = "Language servers and external binaries Neovim's plugins call"
# Everything here has a matching entry in nvim's lua/plugins/lsp/lspconfig.lua.
# That file falls back to :MasonInstall when a binary is missing, so a machine
# without this bundle still gets working LSP, just installed per machine and
# unmanaged.
packages = [
    "cmake-language-server",
    "codespell",
]
mise = [
    "node",
    "lua-language-server",
    "taplo",
    "marksman",
    "stylua",
    "shfmt",
    "bash-language-server",
    "yaml-language-server",
    "vscode-langservers-extracted",
    "dockerfile-language-server-nodejs",
]

[bundles.media]
description = "Audio and video processing"
packages = ["ffmpeg"]

[bundles.ml]
description = "Model and dataset transfer"
packages = ["huggingface_hub"]

[bundles.secrets]
description = "age, sops and the Bitwarden client; see docs/secrets.md"
packages = ["rbw", "libsecret"]
mise = ["age", "sops"]

[bundles.github]
# Its own bundle rather than part of core, because core reaches the vps, and a
# GitHub login is one of the credentials that must never be kept there.
description = "The GitHub CLI; every machine except the vps"
packages = []
mise = ["gh"]

[bundles.extras]
description = "Convenience and diagnostics; nothing here is load-bearing"
packages = ["speedtest-cli", "git-filter-repo"]
mise = ["tre", "fastfetch", "lazydocker"]

[bundles.desktop]
description = "Kitty, its terminal font, and the configuration of the GUI programs"
packages = []
downloads = ["kitty", "maple-mono"]
# Zathura and Fcitx5 come from the distribution; this bundle only supplies
# their configuration.
config = [
    ".config/kitty",
    ".config/zathura",
    ".config/fcitx5",
    ".config/environment.d/im.conf",
    ".config/autostart/org.fcitx.Fcitx5.desktop",
    ".config/systemd/user/wayland-xhost.service",
    ".config/systemd/user/graphical-session.target.wants/wayland-xhost.service",
    ".local/bin/zathura",
]

[bundles.fonts]
description = "Document, design, math, CJK and emoji fonts"
packages = []
downloads = [
    "fira", "nerd-font-fira-code", "tex-gyre-pagella", "libertinus",
    "source-sans", "source-serif", "source-han-sans-sc", "source-han-serif-cn",
    "apple-color-emoji", "noto-color-emoji", "san-francisco-pro",
    "san-francisco-mono", "new-york", "pingfang",
    "newsreader", "inter", "jetbrains-mono", "noto-sans-math",
]

[bundles.research]
description = "Zotero, Better BibTeX and Extra Meta"
packages = []
downloads = ["zotero", "better-bibtex", "extra-meta"]
config = [".config/dotfiles/zotero-user.js"]

[bundles.agent-tools]
description = "Locked Codex, Claude Code, Pi, RTK, Node, Antigravity CLI, and shared 4-agent control plane"
packages = []
mise = ["node", "codex", "claude-code", "pi", "rtk"]
downloads = ["agy"]
config = [
    ".claude",
    ".codex",
    ".gemini",
    ".pi",
]

[bundles.herdr]
description = "Terminal workspaces for coding agents"
packages = []
mise = ["herdr"]
config = [".config/herdr/config.toml"]

[bundles.vpn]
description = "um-vpn, the University of Macau VPN client, for work off campus"
packages = ["um-vpn"]

[bundles.laptop]
description = "Laptop power: the panel refresh rate follows the power source"
packages = []
# The service watches UPower over the system bus and changes the mode through
# mutter over the session bus, which is why it is a user service. It runs on
# the system python3, which has the gi bindings.
config = [
    ".local/bin/refresh-rate-on-power",
    ".config/systemd/user/refresh-rate-on-power.service",
    ".config/systemd/user/graphical-session.target.wants/refresh-rate-on-power.service",
]

################################################################################
# Exposed pixi binaries
#
# A package with no entry here exposes exactly one binary, named after the
# package. Only the exceptions are listed.
################################################################################

[packages.sqlite]
exposed = ["sqlite3"]

[packages.mosh]
# The launcher calls mosh-client, and remote sessions need mosh-server.
exposed = ["mosh", "mosh-client", "mosh-server"]

[packages.clang-tools]
# Deliberately four of the sixty binaries this package ships. The rest are
# either versioned duplicates (clang-tidy-23 beside clang-tidy) or tools no
# editor here calls.
exposed = [
    "clangd",
    "clang-tidy",
    "clang-apply-replacements",
    "run-clang-tidy",
]

[packages.ffmpeg]
exposed = ["ffmpeg", "ffplay", "ffprobe"]

[packages.rbw]
exposed = ["rbw", "rbw-agent"]

[packages.libsecret]
exposed = ["secret-tool"]

[packages.um-vpn]
# conda-forge does not package um-vpn, so pixi builds it from its repository.
# The environment brings its own secret-tool for the stored UMPASS sign-in.
# Commit pinned on 2026-11-19.
git = "https://github.com/xiaosq2000/um-vpn"
rev = "bb5d34dcd5602812bf165f18f7b4ca39e6cdf5cf"
exposed = ["um-vpn"]

[packages.speedtest-cli]
exposed = ["speedtest", "speedtest-cli"]

[packages.huggingface_hub]
exposed = ["hf", "huggingface-cli", "tiny-agents"]

[packages.zsh]
# The package also ships a zsh-5.9 binary; expose only `zsh` so upgrades keep matching.
exposed = ["zsh"]
