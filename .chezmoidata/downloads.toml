# Software that no conda-forge package provides, fetched by dotfiles-fetch
# (dot_local/bin/executable_dotfiles-fetch). A bundle in tools.toml selects an
# entry by its id, chezmoi renders the selection into
# ~/.config/dotfiles/downloads.json, and dotfiles-fetch installs from that.
# chezmoi never downloads these itself: large archives in its source state made
# every `chezmoi cat` and `diff` take seconds and a gigabyte of memory.
#
# Everything installed lives under paths this repository owns outright:
#   ~/.local/opt/dotfiles/<id>/<version>   application payloads
#   ~/.local/opt/dotfiles/bin              command links, on PATH
#   ~/.local/share/fonts/dotfiles/<id>     font files
# so a manual installation elsewhere is never adopted, backed up or replaced.
#
# Fields:
#   github    owner/repo; resolves the latest release. Needs asset or file.
#   asset     release asset name, a glob
#   file      path in the repository at the latest release tag
#   url       a direct download, instead of github
#   asset, file and url take a string, or a table keyed by platform
#   ("linux-amd64", "linux-arm64"). A platform missing from the table is
#   skipped with a warning. A plain string applies to every platform.
#   strip     leading path components to drop from an archive
#   bin       payload paths to link into ~/.local/opt/dotfiles/bin
#   fonts     globs matched against archive paths; `*` also matches `/`.
#             Matching files are installed flat, and nothing else is kept.
#   write     payload-relative path = contents, written after extraction
#   copy      home-relative path = payload path. Written if missing, and
#             updated or removed only while it still holds what was written.
#
# Upstreams checked on 2026-09-23.

# The family the maple-mono entry installs, as fontconfig names it. Kitty and
# Alacritty both render it.
[typography]
terminalFamily = "Maple Mono NF CN"

################################################################################
# Applications
################################################################################

[downloads.kitty]
github = "kovidgoyal/kitty"
asset = { linux-amd64 = "kitty-*-x86_64.txz", linux-arm64 = "kitty-*-arm64.txz" }
bin = ["bin/kitty", "bin/kitten"]
# conda's ncurses, which the pixi zsh uses, ignores the $TERMINFO kitty sets and
# reads ~/.terminfo in the hex layout, 78; Ubuntu's reads the letter layout, x.
# `kitten ssh` writes the same two files on a remote machine, which is why this
# is a copy rather than a file chezmoi manages: copy never fights it.
copy = { ".terminfo/x/xterm-kitty" = "lib/kitty/terminfo/x/xterm-kitty", ".terminfo/78/xterm-kitty" = "lib/kitty/terminfo/x/xterm-kitty" }

[downloads.zotero]
url = { linux-amd64 = "https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64", linux-arm64 = "https://www.zotero.org/download/client/dl?channel=release&platform=linux-arm64" }
strip = 1
bin = ["zotero"]
# The payload is replaced by `dotfiles-fetch update`, so Zotero's own updater
# would only fight it.
write = { "distribution/policies.json" = '{"policies": {"DisableAppUpdate": true}}' }

[downloads.tre]
github = "dduan/tre"
asset = { linux-amd64 = "tre-*-x86_64-unknown-linux-musl.tar.gz" }
bin = ["tre"]

################################################################################
# Fonts
################################################################################

[downloads.maple-mono]
github = "subframe7536/maple-font"
asset = "MapleMono-NF-CN-unhinted.zip"
fonts = ["*.ttf"]

# These upstreams publish fonts in the repository without release assets, so
# they follow a branch. The archive's other formats are left out.
[downloads.fira]
url = "https://codeload.github.com/mozilla/Fira/zip/refs/heads/master"
fonts = ["*/otf/*.otf"]

[downloads.san-francisco-pro]
url = "https://codeload.github.com/sahibjotsaggu/San-Francisco-Pro-Fonts/zip/refs/heads/master"
fonts = ["*.otf"]

[downloads.san-francisco-mono]
url = "https://codeload.github.com/supercomputra/SF-Mono-Font/zip/refs/heads/master"
fonts = ["*.otf"]

[downloads.new-york]
url = "https://codeload.github.com/yell0wsuit/New-York-fonts/zip/refs/heads/master"
fonts = ["*.otf"]

[downloads.pingfang]
url = "https://codeload.github.com/jimmyctk/PingFang-OTF-Fonts/zip/refs/heads/main"
fonts = ["*.otf"]

[downloads.nerd-font-fira-code]
github = "ryanoasis/nerd-fonts"
asset = "FiraCode.zip"
fonts = ["*.ttf"]

# GUST publishes this family at a versioned URL and has no release API.
[downloads.tex-gyre-pagella]
url = "https://www.gust.org.pl/projects/e-foundry/tex-gyre/pagella/qpl2_501otf.zip"
fonts = ["*.otf"]

[downloads.libertinus]
github = "alerque/libertinus"
asset = "Libertinus-*.zip"
fonts = ["*.otf"]

[downloads.source-sans]
github = "adobe-fonts/source-sans"
asset = "OTF-source-sans-*.zip"
fonts = ["*.otf"]

[downloads.source-serif]
github = "adobe-fonts/source-serif"
asset = "source-serif-*_Desktop.zip"
fonts = ["*.otf"]

[downloads.source-han-sans-sc]
github = "adobe-fonts/source-han-sans"
asset = "09_SourceHanSansSC.zip"
fonts = ["*.otf"]

[downloads.source-han-serif-cn]
github = "adobe-fonts/source-han-serif"
asset = "14_SourceHanSerifCN.zip"
fonts = ["*.otf"]

[downloads.apple-color-emoji]
github = "samuelngs/apple-emoji-ttf"
asset = "AppleColorEmoji-Linux.ttf"
fonts = ["*.ttf"]

# The main branch no longer carries the binary font; the release tag does.
[downloads.noto-color-emoji]
github = "googlefonts/noto-emoji"
file = "fonts/NotoColorEmoji.ttf"
fonts = ["*.ttf"]
