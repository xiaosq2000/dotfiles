# Paths here are chezmoi source paths, not destination paths: .zshrc is
# dot_zshrc.tmpl in this tree, ~/.config/fcitx5 is
# private_dot_config/private_fcitx5, and so on.

# Machine-written files: dependency lockfiles, the fcitx5 configs, which the
# fcitx5 GUI rewrites without a trailing newline every time a setting changes,
# and age ciphertext.
#
# The .age exclusion is defensive. The whitespace hooks left the first encrypted
# file alone, but only because its armor happened to end in a newline with no
# trailing spaces; a hook that "fixed" ciphertext would corrupt it, and the
# damage would look like a lost key rather than an edit.
exclude: (dot_config/nvim/lazy-lock.json|dot_opencode/package-lock.json|private_dot_config/private_fcitx5/|\.age$)
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # .chezmoi.toml.tmpl and the run scripts are Go templates, and a
        # template is not valid YAML until it is rendered.
        exclude: \.tmpl$
      - id: check-added-large-files
      # A private key in any file, under any name. .gitignore stops the usual
      # names, but only for `git add .`; this reads what is actually staged.
      - id: detect-private-key
      # A chezmoi modify_ script keeps the name of the file it edits, so
      # modify_settings.json is a shell script, not JSON.
      - id: check-json
        exclude: (^|/)modify_
      - id: pretty-format-json
        args: [--autofix]
        exclude: (^|/)modify_
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  # shellcheck comes from the pixi global manifest, so use the installed
  # binary rather than the upstream hook, which runs inside Docker.
  #
  # Selected explicitly rather than by `types: [shell]`, because the source
  # tree holds three kinds of file shellcheck must not see: zsh scripts, which
  # it cannot parse at all (SC1071), and Go templates, whose {{ ... }} actions
  # are not shell syntax.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck --severity=warning
        language: system
        files: (\.sh$|^dot_bashrc$|^dot_local/bin/executable_(theme|machine|ai-privacy|zathura)$|^dot_(claude|codex)/modify_)
        exclude: (^dot_sh_utils/tools(\.sh|/)|\.tmpl$)
      # The repository is public, so plaintext must never reach a commit under
      # a directory that holds secrets. The script reads the whole index itself,
      # for the reasons at its top, so it takes no file names and runs on every
      # commit. The top-level exclude above would otherwise hide every .age file
      # from it.
      - id: check-encrypted
        name: secrets stay encrypted
        entry: bash .github/scripts/check-encrypted.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # The age identity decrypts every encrypted_ file here, so it must never
      # be committed anywhere in the tree, in plaintext. detect-private-key does
      # not know its format. The length keeps a placeholder such as
      # AGE-SECRET-KEY-1... in a document from matching.
      - id: no-age-identity
        name: no age identity
        entry: AGE-SECRET-KEY-1[0-9A-Z]{58}
        language: pygrep
      # A /home/<name>/ path is an account name, and this repository is public.
      # Write $HOME in a shell file and {{ .chezmoi.homeDir }} in a template.
      # The two excluded files hold placeholders only: an upstream comment in
      # the btop config, and the key-guard test cases.
      - id: no-home-paths
        name: no plaintext home paths
        entry: /home/[A-Za-z0-9._-]+/
        language: pygrep
        exclude: ^(private_dot_config/btop/btop\.conf\.tmpl|\.github/scripts/check-key-guard\.sh)$
      # The guard that keeps agents from reading private keys, against the calls
      # it must refuse and the ones it must let through.
      - id: key-guard
        name: key guard refuses what it should
        entry: bash .github/scripts/check-key-guard.sh
        language: system
        pass_filenames: false
        files: ^(dot_agents/hooks/executable_key-guard\.py|\.github/scripts/check-key-guard\.sh)$
      # bash's set -e does not stop on a command negated with `!`, so in a CI
      # step `! grep -q x file` passes whether or not x is found, unless it
      # happens to be the step's last line. Nine such assertions checked nothing
      # until 2026-09-21. `! cmd || exit 1` fails when it should.
      - id: negated-assertions
        name: negated CI assertions end in || exit 1
        entry: '^\s+! (?!.*\|\| exit 1\s*$)'
        language: pygrep
        files: ^\.github/workflows/.*\.ya?ml$
