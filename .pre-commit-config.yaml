# Machine-written files: vendored plugin source, dependency lockfiles, and the
# fcitx5 configs, which the fcitx5 GUI rewrites without a trailing newline
# every time a setting changes.
exclude: (.config/yazi/plugins|.config/nvim/lazy-lock.json|.opencode/package-lock.json|.config/fcitx5/)
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: pretty-format-json
        args: [--autofix]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  # shellcheck comes from the pixi global manifest, so use the installed
  # binary rather than the upstream hook, which runs inside Docker.
  # zsh files are excluded because shellcheck does not parse zsh (SC1071).
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck --severity=warning
        language: system
        types: [shell]
        exclude: ^(\.zshrc|\.sh_utils/tools(\.sh|/))
