# fcitx5 as the input method. ibus stays installed but must never run.
#
# fcitx5 cannot be a native Wayland IME: mutter implements zwp_text_input_v3
# but not zwp_input_method_v2. Its ibusfrontend addon takes over
# org.freedesktop.IBus instead, so gnome-shell's libibus client drives fcitx5
# and every text-input-v3 app -- kitty included -- reaches it. This breaks the
# moment ibus-daemon starts, so keep GNOME's input sources free of ibus
# engines; adding one makes gnome-shell spawn ibus-daemon to contest the name.
#
# gnome-session sets the three below to ibus values itself when ibus-daemon is
# on $PATH, but only where unset or empty, and systemd reads this file first.
# QT_IM_MODULES has to be listed even though QT_IM_MODULE covers it: left
# unset it becomes "wayland;ibus", which Qt 6.7+ prefers over QT_IM_MODULE.
QT_IM_MODULES=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx

GTK_IM_MODULE=fcitx
SDL_IM_MODULE=fcitx

# X11 only, for GLFW apps such as kitty: they speak the IBus protocol directly
# and support neither XIM nor the GTK/Qt modules. Unused by Wayland kitty.
GLFW_IM_MODULE=ibus
