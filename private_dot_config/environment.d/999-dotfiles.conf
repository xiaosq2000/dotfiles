# Shared desktop/systemd user session environment.
# Prefixed 999- so PATH sorts after Ubuntu's /usr/lib/environment.d/99-environment.conf
# and 990-snapd.conf (verified via 30-systemd-environment-d-generator on 2026-11-19).
PATH=${HOME}/.local/opt/dotfiles/bin:${HOME}/.local/share/mise/shims:${HOME}/.pixi/bin:${HOME}/.local/share/pnpm/bin:${HOME}/.local/bin:${PATH}
BASH_ENV=${HOME}/.config/dotfiles/env.sh
PI_TELEMETRY=0
RTK_TELEMETRY_DISABLED=1
