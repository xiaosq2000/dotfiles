#!/bin/sh
# fcitx5 rewrites Enabled=True/False in ~/.config/fcitx5/conf/punctuation.conf
# every time the user toggles Chinese/English punctuation (Ctrl+.). Own the
# static preferences and hotkey while preserving the current Enabled state.

if ! command -v python3 >/dev/null 2>&1; then
    echo "fcitx5 punctuation: python3 not found; left punctuation.conf unchanged" >&2
    exec cat
fi

exec python3 /dev/fd/3 3<<'PY'
import re
import sys

TEMPLATE = (
    "# Half width punctuation after latin letter or number\n"
    "HalfWidthPuncAfterLetterOrNumber=True\n"
    "# Type paired punctuations together (e.g. Quote)\n"
    "TypePairedPunctuationsTogether=False\n"
    "# Enabled\n"
    "Enabled={enabled}\n"
    "\n"
    "[Hotkey]\n"
    "0=Control+period\n"
    "\n"
)

raw = sys.stdin.read()
try:
    if not raw.strip():
        sys.stdout.write(TEMPLATE.format(enabled="True"))
        sys.exit(0)

    match = re.search(r"(?m)^Enabled=(True|False)\s*$", raw)
    enabled = match.group(1) if match else "True"
    expected = TEMPLATE.format(enabled=enabled)
    # Ignore trailing newline differences that fcitx5 introduces on save.
    if raw.rstrip("\n") == expected.rstrip("\n"):
        sys.stdout.write(raw)
    else:
        sys.stdout.write(expected)
except Exception as error:
    sys.stderr.write("fcitx5 punctuation: left punctuation.conf unchanged: %s\n" % error)
    sys.stdout.write(raw)
PY
