# vim:fileencoding=utf-8:ft=conf
#
# Configuration for the ssh kitten. See
# https://sw.kovidgoyal.net/kitty/kittens/ssh/

# The login shell recorded for this account is /bin/bash and cannot be changed,
# so ~/.bash_profile on the remote hands off to a pixi-installed zsh. That
# handoff is an exec, which throws away the bash shell integration the kitten
# had just installed, and the session ends up with no integration at all.
#
# Without integration the remote never reports its directory, so
# new_window_with_cwd (ctrl+a) falls back to the local directory and passes it
# to the remote as a cwd. The remote cd then fails in bootstrap-utils.sh, and
# because the whole bootstrap script is $0 for the remote sh, the failure
# message prints the entire script to the screen.
#
# Naming the shell here makes the kitten pick its zsh integration directly and
# skip ~/.bash_profile, so the integration survives and the reported directory
# is the remote one. See ~/.sh_utils/CAVEATS.md
hostname ssic
login_shell /home/yc68105/.pixi/bin/zsh
# ~/.bash_profile used to export SHELL on the way to zsh. It is no longer run,
# and the passwd entry still says bash, so set SHELL here instead.
env SHELL=/home/yc68105/.pixi/bin/zsh
