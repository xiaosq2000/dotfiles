# vim:fileencoding=utf-8:ft=conf
#
# Configuration for the ssh kitten. See
# https://sw.kovidgoyal.net/kitty/kittens/ssh/

# sicc records /bin/bash as the login shell and chsh cannot change it, so
# ~/.bash_profile there execs a pixi-installed zsh. That exec throws away the
# bash shell integration the kitten had just installed. A session with no
# integration never reports its directory, so new_window_with_cwd (ctrl+a)
# passes the local directory to the remote, and the kitten's bootstrap fails
# on it. Naming the shell here makes the kitten take its zsh branch directly:
# ~/.bash_profile is never run, and the integration is installed by the shell
# that stays running. ~/.sh_utils/CAVEATS.md describes the handoff itself.
#
# The kitten writes these values into a script that the remote sh sources,
# inside double quotes, so $HOME is expanded on the remote and no account name
# is needed here. Checked against kittens/ssh/main.go in kitty 0.49.0 on
# 2026-09-21. Two spellings that look simpler do not work: ~ is not expanded
# inside those quotes, and a bare zsh is only looked up on sshd's PATH and in
# a fixed list of system directories, never in ~/.pixi/bin.
#
# hostname is matched against the name typed on the command line, which is
# the alias in ~/.ssh/config.
hostname sicc
login_shell $HOME/.pixi/bin/zsh
# ~/.bash_profile used to export SHELL on the way to zsh. It is no longer run,
# and the passwd entry still says bash, so set SHELL here instead.
env SHELL=$HOME/.pixi/bin/zsh
