# Repository development tasks. Not deployed to ~ (listed in .chezmoiignore).
# Global user tools live in .chezmoidata/mise.toml and private_dot_config/mise/.

[tasks.render]
description = "Render all machines, themes, and modify templates and verify shell syntax"
run = "python3 tests/check_render.py"

[tasks.fetch-test]
description = "Run offline dotfiles-fetch fixture tests"
run = "python3 tests/check_fetch.py"

[tasks.secrets-test]
description = "Run offline secret-hook regression tests"
run = "python3 tests/check_secrets_tests.py"

[tasks.test]
description = "Run the full unittest/pytest-compatible repository test suite"
run = "python3 -m unittest discover -s tests -v"

[tasks.cli-test]
description = "Run Rust dotfiles CLI unit tests"
run = "env -u http_proxy -u https_proxy -u all_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY cargo test --manifest-path cli/Cargo.toml"

[tasks.cli-check]
description = "Run cargo clippy and unit tests for the Rust dotfiles CLI"
run = """
set -eu
env -u http_proxy -u https_proxy -u all_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
  cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
env -u http_proxy -u https_proxy -u all_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
  cargo test --manifest-path cli/Cargo.toml
"""

[tasks.build-cli]
description = "Build release Rust dotfiles CLI and install into ~/.local/opt/dotfiles/bin/dotfiles"
run = """
set -eu
env -u http_proxy -u https_proxy -u all_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
  cargo build --release --manifest-path cli/Cargo.toml
mkdir -p "$HOME/.local/opt/dotfiles/bin"
install -m 0755 cli/target/release/dotfiles "$HOME/.local/opt/dotfiles/bin/dotfiles"
rm -f "${XDG_CACHE_HOME:-$HOME/.cache}/zsh/completions/_dotfiles"
echo "Installed $HOME/.local/opt/dotfiles/bin/dotfiles"
"""

[tasks.check]
description = "Run all pre-commit hooks and the full offline repository test suite"
run = """
set -eu
pre-commit run --all-files
python3 -m unittest discover -s tests -v
"""

[tasks.lock-tools]
description = "Regenerate private_dot_config/mise/mise.lock for linux-x64 and linux-arm64"
run = """
python3 - <<'PY'
import os
from pathlib import Path
import shutil
import subprocess
import tempfile
import tomllib

root = Path.cwd()
catalog = tomllib.loads((root / ".chezmoidata/mise.toml").read_text())["mise"]
target_dir = root / "private_dot_config/mise"

env = os.environ.copy()
for scheme in ("http", "https", "ftp", "socks", "all"):
    for key in (f"{scheme}_proxy", f"{scheme}_proxy".upper()):
        env.pop(key, None)

if not env.get("GITHUB_TOKEN") and not env.get("GH_TOKEN") and shutil.which("gh"):
    token = subprocess.run(["gh", "auth", "token"], capture_output=True, text=True, check=False)
    if token.returncode == 0 and token.stdout.strip():
        env["GITHUB_TOKEN"] = token.stdout.strip()

with tempfile.TemporaryDirectory(prefix="dotfiles-mise-lock-") as tmp:
    cfg = Path(tmp) / "cfg"
    cfg.mkdir()
    lines = ["[settings]", "lockfile = true", "", "[tools]"]
    for _id, spec in catalog.items():
        if "version_prefix" in spec:
            val = '{ version = "' + spec["version"] + '", version_prefix = "' + spec["version_prefix"] + '" }'
            lines.append(f'"{spec["tool"]}" = {val}')
        else:
            lines.append(f'"{spec["tool"]}" = "{spec["version"]}"')
    config_file = cfg / "config.toml"
    config_file.write_text("\\n".join(lines) + "\\n")

    env["MISE_CONFIG_DIR"] = str(cfg)
    env["MISE_GLOBAL_CONFIG_FILE"] = str(config_file)
    env["MISE_DATA_DIR"] = str(Path(tmp) / "data")
    env["MISE_CACHE_DIR"] = str(Path(tmp) / "cache")
    env["MISE_STATE_DIR"] = str(Path(tmp) / "state")
    env["MISE_YES"] = "1"

    subprocess.run(
        ["mise", "lock", "--global", "--platform", "linux-x64", "--platform", "linux-arm64"],
        cwd=tmp,
        env=env,
        check=True,
    )

    lock_src = cfg / "mise.lock"
    lock_dst = target_dir / "mise.lock"
    shutil.copyfile(lock_src, lock_dst)
    lock_dst.chmod(0o644)

    locks_dst = target_dir / "locks"
    if locks_dst.exists():
        shutil.rmtree(locks_dst)
    locks_src = cfg / "locks"
    if locks_src.exists():
        shutil.copytree(locks_src, locks_dst)
        for item in locks_dst.rglob("*"):
            item.chmod(0o755 if item.is_dir() else 0o644)

print(f"Updated {lock_dst.relative_to(root)} for {len(catalog)} tools.")
PY
"""
