# Repository development tasks. Not deployed to ~ (listed in .chezmoiignore).
# Global user tools live in .chezmoidata/mise.toml and private_dot_config/mise/.

[tasks.render]
description = "Render all machines, themes, and modify templates and verify shell syntax"
run = "python3 tests/check_render.py"

[tasks.fetch-test]
description = "Run offline dotfiles-fetch fixture tests"
run = "python3 tests/check_fetch.py"

[tasks.secrets-test]
description = "Run offline secret-hook regression tests"
run = "python3 tests/check_secrets_tests.py"

[tasks.test]
description = "Run the full unittest/pytest-compatible repository test suite"
run = "python3 -m unittest discover -s tests -v"

[tasks.cli-test]
description = "Run Rust dotfiles CLI unit tests"
run = "cargo test --manifest-path cli/Cargo.toml"

[tasks.cli-check]
description = "Run cargo clippy and unit tests for the Rust dotfiles CLI"
run = """
set -eu
cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
cargo test --manifest-path cli/Cargo.toml
"""

[tasks.build-cli]
description = "Build release Rust dotfiles CLI and install into ~/.local/opt/dotfiles/bin/dotfiles"
run = """
set -eu
cargo build --release --manifest-path cli/Cargo.toml
mkdir -p "$HOME/.local/opt/dotfiles/bin"
install -m 0755 cli/target/release/dotfiles "$HOME/.local/opt/dotfiles/bin/dotfiles"
rm -f "${XDG_CACHE_HOME:-$HOME/.cache}/zsh/completions/_dotfiles"
echo "Installed $HOME/.local/opt/dotfiles/bin/dotfiles"
"""

[tasks.check]
description = "Run all pre-commit hooks and the full offline repository test suite"
run = """
set -eu
pre-commit run --all-files
python3 -m unittest discover -s tests -v
"""

[tasks.upgrade]
description = "Upgrade managed toolchains locally (mise, pixi, fetch, sheldon, pi)"
run = "python3 dot_local/libexec/dotfiles/executable_upgrade-toolchain.py"
