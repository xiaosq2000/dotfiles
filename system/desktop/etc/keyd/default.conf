# Installed by chezmoi from system/desktop/ in the dotfiles repository. Edit it
# there, then run `sudo -v && chezmoi apply` (or `dotfiles host keymap reload`).
#
# Emulate HHKB muscle memory on built-in and standard external keyboards while
# leaving an actual hardware HHKB untouched once its VID:PID is excluded below.
# Toggle temporarily for colleagues with `dotfiles host keymap off|on|toggle`.
#
# Checked on 2026-11-23 for keyd 2.5.0.

[ids]
*
# Logitech mice expose a keyboard event node alongside the pointer and are
# managed by logid; leave them untouched.
# MX Master 3 (Bluetooth)
-046d:b023
# MX Anywhere 2S (Unifying)
-046d:406a
# Hardware HHKB-layout keyboards (`dotfiles host keymap` prints connected
# keyboard VID:PIDs).
# KBDFans Agar Keyboard (VIAL)
-9d5b:240b

[main]
# CapsLock acts as Left Ctrl; physical Left Ctrl stays Left Ctrl.
capslock = layer(control)

# Right Ctrl sits closest to HHKB's Fn position and activates the HHKB Fn layer.
rightcontrol = layer(hhkb_fn)

[hhkb_fn]
# Classic HHKB diamond arrows: [ = Up, ; = Left, ' = Right, / = Down.
leftbrace = up
semicolon = left
apostrophe = right
slash = down

# HHKB navigation cluster beside the diamond.
k = home
comma = end
l = pageup
dot = pagedown

# HHKB audio controls.
a = volumedown
s = volumeup
d = mute

# Editing, CapsLock fallback, and PrintScreen.
backspace = delete
tab = capslock
backslash = insert
i = sysrq

# Function row (handy on 60%/65% standard keyboards).
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
