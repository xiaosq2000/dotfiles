# Installed by chezmoi from system/desktop/ in the dotfiles repository. Edit it
# there, then run `sudo -v && chezmoi apply` (or `dotfiles host logid restart`).
#
# Checked on 2026-11-23 for logiops 0.3.5.

devices: (
{
    name: "Wireless Mouse MX Master 3";

    thumbwheel:
    {
        divert: true;
        invert: true;

        left:
        {
            mode: "OnInterval";
            interval: 2;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEUP"];
            };
        };

        right:
        {
            mode: "OnInterval";
            interval: 2;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEDOWN"];
            };
        };
    };
},
{
    name: "Wireless Mobile Mouse MX Anywhere 2S";

    buttons: (
        # Forward (front) thumb button: volume up.
        {
            cid: 0x56;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEUP"];
            };
        },
        # Back (rear) thumb button: volume down.
        {
            cid: 0x53;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEDOWN"];
            };
        }
    );
}
);
