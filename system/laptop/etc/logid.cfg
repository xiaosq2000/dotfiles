# Installed by chezmoi from system/laptop/ in the dotfiles repository. Edit it
# there, then run `sudo systemctl restart logid` to apply it.

devices: (
{
    name: "Wireless Mouse MX Master 3";

    thumbwheel:
    {
        divert: true;
        invert: true;

        left:
        {
            mode: "OnInterval";
            interval: 2;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEUP"];
            };
        };

        right:
        {
            mode: "OnInterval";
            interval: 2;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEDOWN"];
            };
        };
    };
}
);
