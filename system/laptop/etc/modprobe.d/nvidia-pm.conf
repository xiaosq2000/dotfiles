# Installed by chezmoi from system/laptop/ in the dotfiles repository. Edit it there.
#
# nvidia-suspend.service saves video memory to a file across suspend. /tmp is
# a tmpfs in RAM and smaller than the 8 GiB of VRAM, so the file goes to /var/tmp.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
